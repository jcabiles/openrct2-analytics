[[row]]
id = "delete-rebuild-and-ready-phrase"
where = "make delete-company-data: the rebuild line of a named delete's preview and the refusal that names the whole-park form"
shown = ["make pipeline DATA_SET=company", "holds the ready phrase of park", "PARK=\"$PARK_ID\"", "scope: park="]
source = "src/openrct2_analytics/ingest/delete_plan.py"
phrases = [
  'print("run `make pipeline DATA_SET=company` to rebuild")',
  'f"session {session} holds the ready phrase of park {label.park_id}; delete the other "',
  'or the whole park with PARK={label.park_id}',
  'print(f"scope: park={plan.scope.park!r}, session={plan.scope.session!r}")',
]

