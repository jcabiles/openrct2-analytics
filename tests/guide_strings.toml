# Code spans the player guide shows as program text or commands: the setup part
# (docs/showcase/story/install-by-hand.md), the play part (how-the-game-works.md) and the help part
# (fix-a-problem.md). Every code span on the built guide must equal a `shown`
# entry here; each `shown` entry must appear in the guide's text; each `phrases` entry must be
# found, as a fixed string, in its `source`. A row has exactly one of `source` (the repo file whose
# code prints or defines the text) and `outside` (the outside tool that prints it).
#
# A red row means the code or the passage changed. The fix is to update the passage and the row in
# the same change (spec docs/ai-dlc/specs/player-guide.md, R29): the change that edits a producer
# fixes its row here and its words in the passage file. Outside rows have no code to compare; the
# dry run of the install steps in a new macOS account checks them (spec R31).

