apiVersion: v3.2.0
kind: DataContract
id: session_start
name: session_start
version: 1.8.0
status: active
description:
  purpose: Session start payload, one event per plugin start.
servers:
  - server: parquet_through_duckdb
    type: duckdb
    database: __DATABASE__
    schema: main
schema:
  - name: session_start
    physicalType: view
    description: >-
      One row per session_start event: at most one per session, the first event the plugin queues, so it carries seq 1.
      A session from plugin 0.1.0, or one whose session_start the queue dropped before the first hand-off, has none. The data is Parquet
      (v1/session_start.parquet), checked through a throwaway DuckDB view. Values are read once at plugin start; the
      game date is the in-game calendar at that moment.
    properties:
      - name: session_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: Plugin start identifier; text, no unit. The grain.
      - name: api_version
        logicalType: integer
        physicalType: INTEGER
        required: true
        logicalTypeOptions:
          minimum: 1
        description: >-
          The game's plugin API level, a version number from 1, read at plugin start. It stands in for the game
          version, which the 0.5.5 plugin API does not expose.
      - name: park_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Park name at plugin start; text, no unit. Not unique, so never an identity.
      - name: scenario_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Name of the scenario the park came from, read at plugin start; text, no unit.
      - name: headless
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: True when the game runs with no window, read at plugin start; no unit.
      - name: game_speed
        logicalType: integer
        physicalType: INTEGER
        required: true
        logicalTypeOptions:
          minimum: 0
        description: Game speed setting at plugin start; engine speed steps, no unit (the same meaning as plugin_stats.game_speed).
      - name: climate
        logicalType: string
        physicalType: VARCHAR
        required: false
        description: >-
          The park's climate, read at plugin start, as the game names it; text, no unit. Expected values (from the
          0.5.5 type definitions, not yet observed from the real game): coolAndWet, warm, hotAndDry or cold. Absent
          in events from plugins before 0.3.0.
      - name: loaded_save_id
        logicalType: string
        physicalType: VARCHAR
        required: false
        description: >-
          The save_id stored in the park this session loaded, read at plugin start; text, no unit. It matches that
          save's save_written event. Null when the park was never saved by plugin 0.3.0 or later, or the stored value
          is not a non-empty string; absent in events from plugins before 0.3.0.
      - name: loaded_save_session_id
        logicalType: string
        physicalType: VARCHAR
        required: false
        description: >-
          The session that wrote the loaded save, read from park storage at plugin start; text, no unit. Null under
          the same rule as loaded_save_id.
      - name: loaded_save_seq_floor
        logicalType: integer
        physicalType: BIGINT
        required: false
        logicalTypeOptions:
          minimum: 0
        description: >-
          The last seq the writing session had handed off when the loaded save was made, 0 if none; session order,
          not a clock. With loaded_save_lines_waiting it places the save's cut in the writing session when its
          save_written event was lost: that event would have taken seq floor + waiting + 1, unless the queue dropped
          lines ahead of it, which plugin_stats.lines_dropped_total counts. Null when absent or not a whole number
          from 0 to 2^53 - 1.
      - name: loaded_save_lines_waiting
        logicalType: integer
        physicalType: INTEGER
        required: false
        logicalTypeOptions:
          minimum: 0
        description: >-
          Lines the writing session had queued and not yet handed off when the loaded save was made, before the
          save's own save_written event; a count. Null when absent or not a whole number from 0 to 2,147,483,647.
    quality:
      - type: sql
        description: session_start is the session's first event
        query: SELECT COUNT(*) FROM {object} WHERE seq <> 1
        mustBe: 0
