apiVersion: v3.2.0
kind: DataContract
id: guest_arrived
name: guest_arrived
version: 1.8.0
status: active
description:
  purpose: One event per guest the game's guest-generation hook reported.
servers:
  - server: parquet_through_duckdb
    type: duckdb
    database: __DATABASE__
    schema: main
schema:
  - name: guest_arrived
    physicalType: view
    description: >-
      One row per guest the game's guest.generation hook reported, sent by plugin 0.4.0 and later. The data is
      Parquet (v1/guest_arrived.parquet), checked through a throwaway DuckDB view. The hook fires when the guest
      is generated and the plugin records it at the next step it runs, so the envelope's game_ticks_elapsed can
      trail generated_at_ticks by a few ticks. A guest generated while the plugin was not running, or whose
      record the work queue dropped, has no row.
    properties:
      - name: guest_key
        logicalType: integer
        physicalType: INTEGER
        required: true
        logicalTypeOptions:
          minimum: 1
        description: >-
          Minted by the plugin, unique within one session; the pair (session_id, guest_key) names a guest. A
          whole number, no unit.
      - name: guest_id
        logicalType: integer
        physicalType: INTEGER
        required: true
        logicalTypeOptions:
          minimum: 0
        description: >-
          The game's guest entity slot number, a whole number; the game reuses a slot, so it is not an identity
          (use guest_key).
      - name: generated_at_ticks
        logicalType: integer
        physicalType: BIGINT
        required: true
        logicalTypeOptions:
          minimum: 0
        description: >-
          Game tick at which the generation hook fired, in game ticks (game clock). Not the envelope's
          game_ticks_elapsed, which is the tick the event was built.
      - name: in_cohort
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: >-
          Whether the guest was chosen for the daily guest_snapshot cohort; true or false, no unit.
      - name: guest_cash_tenths
        logicalType: integer
        physicalType: BIGINT
        required: false
        description: >-
          The guest's cash when the arrival step ran, in tenths of a dollar (game money unit); null when the
          entity was no longer a guest at that step.
    quality:
      - type: sql
        description: a guest key is at least 1
        query: SELECT COUNT(*) FROM {object} WHERE guest_key < 1
        mustBe: 0
