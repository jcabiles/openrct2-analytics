version: 2

models:
  - name: obt_ride_year
    description: >-
      Answers how many riders each ride carried in each company year, how the
      rides rank within their park, and the ride's latest guest rating and age
      that year, for the Attractions panels. Grain: one row per ride occupancy
      per company year with at least one kept ride-day, rides only; key:
      ride_year_key. It reads only the ride-day fact, the ride dimension and
      the date dimension. A company year still in progress covers only its
      captured days, which first_company_date and last_company_date state.
      Unit: guests, rank, percent, months and days as stated per measure;
      clock: company year. On the zero-row build the model is empty because
      there are no kept ride-days.
    config:
      contract:
        enforced: true
    meta:
      expected_min_rows: 1
    data_tests:
      - rows_on_sample:
          arguments:
            expected: 7
    columns:
      - name: ride_year_key
        data_type: varchar
        description: "Ride key and company year joined by a pipe; text, no unit; clock: company date."
        data_tests:
          - unique
          - not_null
      - name: ride_key
        data_type: varchar
        description: "Park, ride slot, build month and first tick joined by pipes; text, no unit; no clock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ride')
                field: ride_key
      - name: park_id
        data_type: varchar
        description: "Stable identifier for the park save; text, no unit; no clock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_park')
                field: park_id
      - name: ride_name
        data_type: varchar
        description: "Latest kept name of the ride occupancy; text, no unit; no clock."
      - name: company_year
        data_type: integer
        description: "Company year of the kept ride-days; unit: year; clock: company date."
        data_tests:
          - not_null
      - name: first_company_date
        data_type: date
        description: "Earliest company date of the year's kept ride-days; unit: date; clock: company date."
      - name: last_company_date
        data_type: date
        description: "Latest company date of the year's kept ride-days; unit: date; clock: company date."
      - name: ride_days
        data_type: integer
        description: "Count of the year's kept ride-days; unit: days; clock: game day."
      - name: riders
        data_type: bigint
        description: "Sum of the daily rise in the guest counter over the year's kept ride-days; null when every day is null. Each day's value runs to the next kept reading, so the last day's rise may reach into the next year's first reading; a rise across a session break is not counted; on-ride photo sales count as riders; unit: guests; clock: company year."
      - name: riders_rank_in_park_year
        data_type: integer
        description: "Rank of the ride by riders within its park and company year, 1 for the most riders, nulls last, ties broken by ride key; ranks never compare parks; unit: rank; clock: company year."
        data_tests:
          - not_null
      - name: latest_guest_rating_pct
        data_type: integer
        description: "The game's guest satisfaction rating at the latest kept ride-day of the year where it is not null; null when none; unit: percent, 0 to 100; clock: game day (that reading)."
      - name: latest_ride_age_months
        data_type: integer
        description: "Age of the ride at the latest kept ride-day of the year where it is not null; null when none; unit: month; clock: game day (that reading)."

unit_tests:
  - name: obt_ride_year_u_rolls_up_and_ranks
    description: >-
      It proves that rides in each park and company year roll up to one row
      each (given out of key order): riders are summed, the latest guest rating
      is the latest non-null one (70, not the null on the later day), the latest
      ride age comes from the latest day, null riders rank last, and equal
      riders are ranked by ride key without comparing parks.
    model: obt_ride_year
    given:
      - input: ref('fct_ride_day')
        format: sql
        rows: |
          select cast('park_a|6|6' as varchar) as ride_key, cast('park_a' as varchar) as park_id, cast('2000-03-01' as date) as company_date, cast('ride' as varchar) as classification, cast(null as bigint) as customers_increase, cast(null as integer) as guest_rating_pct, cast(null as integer) as ride_age_months
          union all
          select cast('park_a|5|5' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_a|4|4' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_a|3|3' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_a|2|2' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_a|1|1' as varchar), cast('park_a' as varchar), cast('2000-03-02' as date), cast('ride' as varchar), cast(7 as bigint), cast(null as integer), cast(11 as integer)
          union all
          select cast('park_a|1|1' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(5 as bigint), cast(70 as integer), cast(10 as integer)
          union all
          select cast('park_a|0|0' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(50 as integer), cast(5 as integer)
          union all
          select cast('park_b|2|2' as varchar), cast('park_b' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_b|1|1' as varchar), cast('park_b' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_b|0|0' as varchar), cast('park_b' as varchar), cast('2000-03-01' as date), cast('ride' as varchar), cast(12 as bigint), cast(60 as integer), cast(20 as integer)
          union all
          select cast('park_a|7|7' as varchar), cast('park_a' as varchar), cast('2000-03-01' as date), cast('stall' as varchar), cast(99 as bigint), cast(null as integer), cast(30 as integer)
      - input: ref('dim_ride')
        format: sql
        rows: |
          select cast('park_a|1|1' as varchar) as ride_key, cast('Wild Mouse' as varchar) as ride_name
          union all
          select cast('park_a|0|0' as varchar), cast('Tea Cups' as varchar)
          union all
          select cast('park_a|2|2' as varchar), cast('Log Flume' as varchar)
          union all
          select cast('park_a|3|3' as varchar), cast('Burger Barn' as varchar)
          union all
          select cast('park_a|4|4' as varchar), cast('Ride 4' as varchar)
          union all
          select cast('park_a|5|5' as varchar), cast('Ride 5' as varchar)
          union all
          select cast('park_a|6|6' as varchar), cast('Ride 6' as varchar)
          union all
          select cast('park_a|7|7' as varchar), cast('Burger Barn' as varchar)
          union all
          select cast('park_b|2|2' as varchar), cast('Ride B2' as varchar)
          union all
          select cast('park_b|1|1' as varchar), cast('Ride B1' as varchar)
          union all
          select cast('park_b|0|0' as varchar), cast('Ride B0' as varchar)
      - input: ref('dim_date')
        format: sql
        rows: |
          select cast('2000-03-01' as date) as company_date, cast(2000 as integer) as company_year
          union all
          select cast('2000-03-02' as date), cast(2000 as integer)
    expect:
      rows:
        - {ride_year_key: 'park_a|0|0|2000', ride_key: 'park_a|0|0', park_id: park_a, ride_name: 'Tea Cups', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 1, latest_guest_rating_pct: 50, latest_ride_age_months: 5}
        - {ride_year_key: 'park_a|1|1|2000', ride_key: 'park_a|1|1', park_id: park_a, ride_name: 'Wild Mouse', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-02', ride_days: 2, riders: 12, riders_rank_in_park_year: 2, latest_guest_rating_pct: 70, latest_ride_age_months: 11}
        - {ride_year_key: 'park_a|2|2|2000', ride_key: 'park_a|2|2', park_id: park_a, ride_name: 'Log Flume', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 3, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_a|3|3|2000', ride_key: 'park_a|3|3', park_id: park_a, ride_name: 'Burger Barn', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 4, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_a|4|4|2000', ride_key: 'park_a|4|4', park_id: park_a, ride_name: 'Ride 4', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 5, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_a|5|5|2000', ride_key: 'park_a|5|5', park_id: park_a, ride_name: 'Ride 5', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 6, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_a|6|6|2000', ride_key: 'park_a|6|6', park_id: park_a, ride_name: 'Ride 6', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: null, riders_rank_in_park_year: 7, latest_guest_rating_pct: null, latest_ride_age_months: null}
        - {ride_year_key: 'park_b|0|0|2000', ride_key: 'park_b|0|0', park_id: park_b, ride_name: 'Ride B0', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 1, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_b|1|1|2000', ride_key: 'park_b|1|1', park_id: park_b, ride_name: 'Ride B1', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 2, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
        - {ride_year_key: 'park_b|2|2|2000', ride_key: 'park_b|2|2', park_id: park_b, ride_name: 'Ride B2', company_year: 2000, first_company_date: '2000-03-01', last_company_date: '2000-03-01', ride_days: 1, riders: 12, riders_rank_in_park_year: 3, latest_guest_rating_pct: 60, latest_ride_age_months: 20}
