version: 2

models:
  - name: obt_park_month
    description: >-
      Answers how much a park earned, spent and operated in each kept closed
      statement month. Grain: one row per park per kept statement month (a
      closed game month); key: park_month_key, matching fct_park_month. It
      reads only the park-month and park-day facts. Only months with a kept
      statement have rows; for example, a month whose statement was not kept
      has no row (on the sample, June). A statement month with no kept
      park-days has zero operating days and days with visits, null guest
      visits and rating sum, and a null average rating and ratios. Unit: US
      dollars, guests, days and rating points as stated per measure; clock:
      company date (month). On the zero-row build the model is empty because
      there are no kept statements.
    config:
      contract:
        enforced: true
    meta:
      expected_min_rows: 1
    data_tests:
      - rows_on_sample:
          arguments:
            expected: 3
    columns:
      - name: park_month_key
        data_type: varchar
        description: "Key matching the kept park statement month; unit: text; clock: company date (month)."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_park_month')
                field: park_month_key
      - name: park_id
        data_type: varchar
        description: "Stable park identifier; unit: text; clock: company date (month)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_park')
                field: park_id
      - name: statement_year
        data_type: integer
        description: "In-game statement year; unit: year; clock: game calendar (month)."
      - name: statement_month
        data_type: integer
        description: "In-game statement month, numbered 0 to 7; unit: month; clock: game calendar (month)."
      - name: company_year
        data_type: integer
        description: "Company year for the statement; unit: year; clock: company date (month)."
        data_tests:
          - not_null
      - name: company_date
        data_type: date
        description: "First day of the statement's company month; unit: date; clock: company date (month)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: company_date
      - name: operating_profit
        data_type: decimal(18,2)
        description: "Park operating profit from the kept statement; unit: US dollars; clock: company date (month)."
        data_tests:
          - not_null
      - name: operating_revenue
        data_type: decimal(18,2)
        description: "Ride, food and drink, merchandise, and entrance revenue summed from the kept statement; unit: US dollars; clock: company date (month)."
      - name: ride_revenue
        data_type: decimal(18,2)
        description: "Revenue from ride tickets; unit: US dollars; clock: company date (month)."
      - name: food_drink_revenue
        data_type: decimal(18,2)
        description: "Revenue from food and drink sales; unit: US dollars; clock: company date (month)."
      - name: merchandise_revenue
        data_type: decimal(18,2)
        description: "Revenue from shop sales; unit: US dollars; clock: company date (month)."
      - name: entrance_revenue
        data_type: decimal(18,2)
        description: "Revenue from park entrance tickets; unit: US dollars; clock: company date (month)."
      - name: operating_costs
        data_type: decimal(18,2)
        description: "Ride running costs, wages, stock, marketing and research costs summed from the kept statement; costs are negative; unit: US dollars; clock: company date (month)."
      - name: ride_running_costs
        data_type: decimal(18,2)
        description: "Costs to run rides; costs are negative; unit: US dollars; clock: company date (month)."
      - name: staff_wages
        data_type: decimal(18,2)
        description: "Staff wages; costs are negative; unit: US dollars; clock: company date (month)."
      - name: stock_costs
        data_type: decimal(18,2)
        description: "Shop and food and drink stock costs; costs are negative; unit: US dollars; clock: company date (month)."
      - name: marketing_costs
        data_type: decimal(18,2)
        description: "Marketing costs; costs are negative; unit: US dollars; clock: company date (month)."
      - name: research_costs
        data_type: decimal(18,2)
        description: "Research costs; costs are negative; unit: US dollars; clock: company date (month)."
      - name: capital_spending
        data_type: decimal(18,2)
        description: "Capital spending from the kept statement; unit: US dollars; clock: company date (month)."
      - name: interest_costs
        data_type: decimal(18,2)
        description: "Interest costs from the kept statement; costs are negative; unit: US dollars; clock: company date (month)."
      - name: guest_visits
        data_type: bigint
        description: "Admissions increase summed over kept park-days; null if there are no kept park-days. Each session's last kept day has no admissions figure, so days_with_visits can be below operating_days and guest_visits misses that day's visits. Unit: guests; clock: company date (month)."
      - name: operating_days
        data_type: integer
        description: "Count of kept park-days in the statement month; unit: days; clock: company date (month)."
        data_tests:
          - not_null
      - name: days_with_visits
        data_type: integer
        description: "Kept park-days of the month with an admissions figure; each session's last kept day has none, so this can be below operating_days and guest_visits misses that day's visits; unit: days; clock: company date (month)."
        data_tests:
          - not_null
      - name: park_rating_sum
        data_type: bigint
        description: "Sum of park ratings at the start of kept park-days; null if there are no kept park-days; unit: rating points; clock: company date (month)."
      - name: average_park_rating
        data_type: decimal(18,2)
        description: "park_rating_sum divided by operating_days, never an average of averages; null when there are no operating days; range 0 to 999 rating points; unit: rating points; clock: company date (month)."
      - name: revenue_per_visit
        data_type: decimal(18,2)
        description: "operating_revenue divided by guest_visits after summing
          the month's statement lines; unit: US dollars per guest; clock:
          company date (month). Statement revenue covers the whole game month,
          while visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."
      - name: ride_revenue_per_visit
        data_type: decimal(18,2)
        description: "ride_revenue divided by guest_visits after summing the
          month's statement lines; unit: US dollars per guest; clock: company
          date (month). Statement revenue covers the whole game month, while
          visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."
      - name: food_drink_revenue_per_visit
        data_type: decimal(18,2)
        description: "food_drink_revenue divided by guest_visits after summing
          the month's statement lines; unit: US dollars per guest; clock:
          company date (month). Statement revenue covers the whole game month,
          while visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."
      - name: merchandise_revenue_per_visit
        data_type: decimal(18,2)
        description: "merchandise_revenue divided by guest_visits after summing
          the month's statement lines; unit: US dollars per guest; clock:
          company date (month). Statement revenue covers the whole game month,
          while visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."
      - name: entrance_revenue_per_visit
        data_type: decimal(18,2)
        description: "entrance_revenue divided by guest_visits after summing
          the month's statement lines; unit: US dollars per guest; clock:
          company date (month). Statement revenue covers the whole game month, while visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."
      - name: ride_revenue_share_pct
        data_type: decimal(18,2)
        description: "100 times ride_revenue divided by operating_revenue; unit: percent of operating revenue; clock: company date (month). Null when operating_revenue is null or 0. The four shares add to 100 within 0.04 of rounding."
      - name: food_drink_revenue_share_pct
        data_type: decimal(18,2)
        description: "100 times food_drink_revenue divided by operating_revenue; unit: percent of operating revenue; clock: company date (month). Null when operating_revenue is null or 0. The four shares add to 100 within 0.04 of rounding."
      - name: merchandise_revenue_share_pct
        data_type: decimal(18,2)
        description: "100 times merchandise_revenue divided by operating_revenue; unit: percent of operating revenue; clock: company date (month). Null when operating_revenue is null or 0. The four shares add to 100 within 0.04 of rounding. On-ride photo sales are counted in merchandise."
      - name: entrance_revenue_share_pct
        data_type: decimal(18,2)
        description: "100 times entrance_revenue divided by operating_revenue; unit: percent of operating revenue; clock: company date (month). Null when operating_revenue is null or 0. The four shares add to 100 within 0.04 of rounding."
      - name: revenue_per_operating_day
        data_type: decimal(18,2)
        description: "operating_revenue divided by operating_days after summing
          the month's statement lines; unit: US dollars per operating day;
          clock: company date (month). Statement revenue covers the whole game
          month, while visits and days count only captured park-days, so a month with few captured days reads high and a month with no captured days is null."

