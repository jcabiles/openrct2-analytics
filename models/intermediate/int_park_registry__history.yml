version: 2

models:
  - name: int_park_registry__history
    description: >-
      Answers which registry delivery was the latest word on each park on any date, so a game date can be turned
      into a company date as the registry stood then, and a corrected start year does not erase the earlier one.
      Grain: one row per feed row, key park_id with delivery_file; two rows for one park in one file are both
      kept and share an interval, even when their delivered_on cells differ. A delivery is a file. Deliveries
      are ordered per park by the date in the file name, then the sequence in the file name, and derived on
      every build with window functions; the delivered_on cell never orders them. The interval is half-open: a row applies on date d
      when valid_from <= d < valid_to, and a null valid_to means the delivery is current. A same-day correction
      leaves the earlier delivery an empty interval. Files whose names do not match
      park_registry_<YYYY-MM-DD>_<NN>.csv, or whose sequence is 00, are left out and a warn test names them. The model has no unit;
      clock: wall-clock delivery date, not a company date.
    meta:
      park_registry: history
      expected_min_rows: 1
    data_tests:
      - unique:
          column_name: "park_id || '|' || delivery_file"
          config:
            severity: warn
    columns:
      - name: park_id
        description: "The park's identifier, the same text the plugin sends; no unit; no clock."
        data_tests: [not_null]
      - name: company_start_year
        description: "Company calendar year of the park's first game year, as this delivery stated it; unit: year; clock: company date."
      - name: game_year_origin
        description: "Game year that counts as the park's first company year, as this delivery stated it; unit: game year; clock: game."
      - name: data_set
        description: "Data set the row belongs to, rehearsal or company; text; no unit; no clock."
      - name: note
        description: "Free text from the delivery, may be empty; no unit; no clock."
      - name: delivered_on
        description: "Calendar date of the delivery as the row states it, no time; no unit; clock: wall-clock delivery date."
        data_tests: [not_null]
      - name: delivery_file
        description: "Path of the delivery file as the folder was globbed, relative on dev and ci, absolute in a publish; text; no unit; no clock."
        data_tests: [not_null]
      - name: file_name
        description: "Base name of the delivery file, never a path; text; no unit; no clock."
        data_tests: [not_null]
      - name: file_date
        description: "Date written in the file name as YYYY-MM-DD text, not cast, the name's shape is checked but not the calendar, so a name with an impossible date fails the build at the date cast in valid_from; no unit; clock: wall-clock delivery date."
        data_tests: [not_null]
      - name: file_sequence
        description: "Two-digit sequence in the file name, 1 to 99, ordering deliveries of one day; unit: delivery number; no clock."
        data_tests: [not_null]
      - name: valid_from
        description: "First date this delivery applies, the date in its file name, inclusive; no unit; clock: wall-clock delivery date."
        data_tests: [not_null]
      - name: valid_to
        description: "File name date of the park's next distinct delivery, exclusive, null while this delivery is current; no unit; clock: wall-clock delivery date."
      - name: is_current
        description: "True where valid_to is null, the park's latest delivery; boolean, no unit; no clock."
        data_tests: [not_null]

unit_tests:
  - name: int_park_registry__history_keeps_a_correction_and_closes_the_first
    description: It proves a later delivery restating Park 2 with an earlier start year keeps both rows and closes the first at the correction's date.
    model: int_park_registry__history
    given:
      - input: ref('stg_park_registry')
        format: sql
        rows: |
          select cast('park2' as varchar) as park_id, cast(2004 as integer) as company_start_year, cast(3 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set, cast('first' as varchar) as note, cast('2026-10-10' as date) as delivered_on, cast('data/park_registry_2026-10-10_01.csv' as varchar) as delivery_file
          union all
          select cast('park2' as varchar) as park_id, cast(2003 as integer) as company_start_year, cast(5 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set, cast('correction' as varchar) as note, cast('2026-10-12' as date) as delivered_on, cast('data/park_registry_2026-10-12_01.csv' as varchar) as delivery_file
    expect:
      rows:
        - {company_start_year: 2004, valid_from: '2026-10-10', valid_to: '2026-10-12', is_current: false}
        - {company_start_year: 2003, valid_from: '2026-10-12', valid_to: null, is_current: true}
