  - name: int_park_registry__history_gives_two_rows_of_one_file_one_interval
    description: It proves two rows for one park in one file both stay and share the interval, and both close when a later delivery arrives.
    model: int_park_registry__history
    given:
      - input: ref('stg_park_registry')
        format: sql
        rows: |
          select cast('park4' as varchar) as park_id, cast(2010 as integer) as company_start_year, cast(11 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set, cast('row a' as varchar) as note, cast('2026-10-10' as date) as delivered_on, cast('data/park_registry_2026-10-10_01.csv' as varchar) as delivery_file
          union all
          select cast('park4' as varchar) as park_id, cast(2011 as integer) as company_start_year, cast(13 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set, cast('row b' as varchar) as note, cast('2026-10-10' as date) as delivered_on, cast('data/park_registry_2026-10-10_01.csv' as varchar) as delivery_file
          union all
          select cast('park4' as varchar) as park_id, cast(2012 as integer) as company_start_year, cast(15 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set, cast('later' as varchar) as note, cast('2026-10-14' as date) as delivered_on, cast('data/park_registry_2026-10-14_01.csv' as varchar) as delivery_file
    expect:
      rows:
        - {note: 'row a', valid_from: '2026-10-10', valid_to: '2026-10-14', is_current: false}
        - {note: 'row b', valid_from: '2026-10-10', valid_to: '2026-10-14', is_current: false}
        - {note: later, valid_from: '2026-10-14', valid_to: null, is_current: true}
