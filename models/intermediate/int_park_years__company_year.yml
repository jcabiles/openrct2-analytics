version: 2

models:
  - name: int_park_years__company_year
    description: >-
      Answers which company year each park's game year belongs to and which company dates it spans, so a
      company-year figure is never read for a park whose registry row is missing or does not cover that game year.
      Grain: one row per park and game year landed in stg_envelope, key park_id with game_year. A park-year
      that cannot map keeps its row with mapping_status unregistered (no current registry row), before_origin
      (game year before the origin) or game_month_out_of_range (a landed month outside 0 to 7), and its dates and
      company_year are null; a singular test fails the build on any such row. The company year comes from
      int_park_years__registry_mapped, and an event's company date comes from one join to
      int_park_days__company_calendar. The model has no unit;
      clock: company date for its dates, game calendar for its game year.
    meta:
      expected_min_rows: 1
    data_tests:
      - unique:
          column_name: "park_id || '|' || game_year"
    columns:
      - name: park_id
        description: "The park's identifier, the same text the plugin sends; no unit; no clock."
        data_tests: [not_null]
      - name: game_year
        description: "In-game year landed for the park, from 1; unit: year; clock: game calendar."
        data_tests: [not_null]
      - name: data_set
        description: "Data set the park's registry row names, rehearsal or company; null when unregistered; text; no unit; no clock."
      - name: company_start_year
        description: "Company calendar year of the park's first game year, from its current registry row; null when unregistered; unit: year; clock: company date."
      - name: game_year_origin
        description: "Game year that counts as the park's first company year, from its current registry row; null when unregistered; unit: game year; clock: game calendar."
      - name: company_year
        description: "Company year from int_park_years__registry_mapped; null unless mapping_status is mapped; unit: year; clock: company date."
      - name: season_start
        description: "First day of the season: 1 March of the company year; null unless mapped; no unit; clock: company date."
      - name: season_end
        description: "Last day of the season: 31 October of the company year, as a season runs 8 months; null unless mapped; no unit; clock: company date."
      - name: first_company_date
        description: "Company date of the earliest landed game month and day of the park-year; null unless mapped; no unit; clock: company date."
      - name: last_company_date
        description: "Company date of the latest landed game month and day of the park-year; null unless mapped; no unit; clock: company date."
      - name: mapping_status
        description: "mapped, unregistered, before_origin or game_month_out_of_range; one of four values, the first that applies in that order of unregistered, before_origin, game_month_out_of_range; text; no unit; no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mapped, unregistered, before_origin, game_month_out_of_range]

unit_tests:
  - name: int_park_years__company_year_maps_two_parks_and_flags_the_unmapped
    description: >-
      It proves that given Park 1 (start 2000, origin 9) and Park 2 (start 2003, origin 6), each park-year gets
      the mapped company year, the first and last dates are the earliest and latest
      landed month and day pair even when both parks land the same game year, months 0 to 7 map to March to October,
      and a game year before the origin, an unregistered park and a month 8 each get their status with null dates.
    model: int_park_years__company_year
    given:
      - input: ref('stg_envelope')
        format: sql
        rows: |
          select cast('park1' as varchar) as park_id, cast(9 as integer) as game_year, cast(1 as integer) as game_month, cast(28 as integer) as game_day
          union all
          select cast('park1' as varchar), cast(9 as integer), cast(2 as integer), cast(3 as integer)
          union all
          select cast('park1' as varchar), cast(10 as integer), cast(0 as integer), cast(1 as integer)
          union all
          select cast('park1' as varchar), cast(10 as integer), cast(0 as integer), cast(1 as integer)
          union all
          select cast('park1' as varchar), cast(11 as integer), cast(2 as integer), cast(4 as integer)
          union all
          select cast('park1' as varchar), cast(11 as integer), cast(8 as integer), cast(5 as integer)
          union all
          select cast('park1' as varchar), cast(12 as integer), cast(4 as integer), cast(15 as integer)
          union all
          select cast('park1' as varchar), cast(12 as integer), cast(5 as integer), cast(2 as integer)
          union all
          select cast('park1' as varchar), cast(12 as integer), cast(6 as integer), cast(11 as integer)
          union all
          select cast('park1' as varchar), cast(12 as integer), cast(7 as integer), cast(31 as integer)
          union all
          select cast('park1' as varchar), cast(13 as integer), cast(1 as integer), cast(12 as integer)
          union all
          select cast('park1' as varchar), cast(14 as integer), cast(2 as integer), cast(10 as integer)
          union all
          select cast('park2' as varchar), cast(5 as integer), cast(3 as integer), cast(6 as integer)
          union all
          select cast('park2' as varchar), cast(6 as integer), cast(3 as integer), cast(4 as integer)
          union all
          select cast('park2' as varchar), cast(6 as integer), cast(7 as integer), cast(31 as integer)
          union all
          select cast('park2' as varchar), cast(7 as integer), cast(4 as integer), cast(6 as integer)
          union all
          select cast('park2' as varchar), cast(8 as integer), cast(5 as integer), cast(9 as integer)
          union all
          select cast('park2' as varchar), cast(9 as integer), cast(4 as integer), cast(5 as integer)
          union all
          select cast('park2' as varchar), cast(9 as integer), cast(6 as integer), cast(25 as integer)
          union all
          select cast('park3' as varchar), cast(1 as integer), cast(4 as integer), cast(7 as integer)
      - input: ref('int_park_years__registry_mapped')
        format: sql
        rows: |
          select cast('park1|9' as varchar) as park_year_key, cast('park1' as varchar) as park_id, cast(9 as integer) as game_year, cast('rehearsal' as varchar) as data_set, cast(2000 as integer) as company_start_year, cast(9 as integer) as game_year_origin, cast(2000 as integer) as company_year, cast('mapped' as varchar) as mapping_status
          union all
          select cast('park1|10' as varchar), cast('park1' as varchar), cast(10 as integer), cast('rehearsal' as varchar), cast(2000 as integer), cast(9 as integer), cast(2001 as integer), cast('mapped' as varchar)
          union all
          select cast('park1|11' as varchar), cast('park1' as varchar), cast(11 as integer), cast('rehearsal' as varchar), cast(2000 as integer), cast(9 as integer), cast(2002 as integer), cast('mapped' as varchar)
          union all
          select cast('park1|12' as varchar), cast('park1' as varchar), cast(12 as integer), cast('rehearsal' as varchar), cast(2000 as integer), cast(9 as integer), cast(2003 as integer), cast('mapped' as varchar)
          union all
          select cast('park1|13' as varchar), cast('park1' as varchar), cast(13 as integer), cast('rehearsal' as varchar), cast(2000 as integer), cast(9 as integer), cast(2004 as integer), cast('mapped' as varchar)
          union all
          select cast('park1|14' as varchar), cast('park1' as varchar), cast(14 as integer), cast('rehearsal' as varchar), cast(2000 as integer), cast(9 as integer), cast(2005 as integer), cast('mapped' as varchar)
          union all
          select cast('park2|5' as varchar), cast('park2' as varchar), cast(5 as integer), cast('rehearsal' as varchar), cast(2003 as integer), cast(6 as integer), cast(null as integer), cast('before_origin' as varchar)
          union all
          select cast('park2|6' as varchar), cast('park2' as varchar), cast(6 as integer), cast('rehearsal' as varchar), cast(2003 as integer), cast(6 as integer), cast(2003 as integer), cast('mapped' as varchar)
          union all
          select cast('park2|7' as varchar), cast('park2' as varchar), cast(7 as integer), cast('rehearsal' as varchar), cast(2003 as integer), cast(6 as integer), cast(2004 as integer), cast('mapped' as varchar)
          union all
          select cast('park2|8' as varchar), cast('park2' as varchar), cast(8 as integer), cast('rehearsal' as varchar), cast(2003 as integer), cast(6 as integer), cast(2005 as integer), cast('mapped' as varchar)
          union all
          select cast('park2|9' as varchar), cast('park2' as varchar), cast(9 as integer), cast('rehearsal' as varchar), cast(2003 as integer), cast(6 as integer), cast(2006 as integer), cast('mapped' as varchar)
          union all
          select cast('park3|1' as varchar), cast('park3' as varchar), cast(1 as integer), cast(null as varchar), cast(null as integer), cast(null as integer), cast(null as integer), cast('unregistered' as varchar)
    expect:
      rows:
        - {park_id: park1, game_year: 9, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2000, season_start: '2000-03-01', season_end: '2000-10-31', first_company_date: '2000-04-28', last_company_date: '2000-05-03', mapping_status: mapped}
        - {park_id: park1, game_year: 10, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2001, season_start: '2001-03-01', season_end: '2001-10-31', first_company_date: '2001-03-01', last_company_date: '2001-03-01', mapping_status: mapped}
        - {park_id: park1, game_year: 11, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: null, season_start: null, season_end: null, first_company_date: null, last_company_date: null, mapping_status: game_month_out_of_range}
        - {park_id: park1, game_year: 12, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2003, season_start: '2003-03-01', season_end: '2003-10-31', first_company_date: '2003-07-15', last_company_date: '2003-10-31', mapping_status: mapped}
        - {park_id: park1, game_year: 13, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2004, season_start: '2004-03-01', season_end: '2004-10-31', first_company_date: '2004-04-12', last_company_date: '2004-04-12', mapping_status: mapped}
        - {park_id: park1, game_year: 14, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2005, season_start: '2005-03-01', season_end: '2005-10-31', first_company_date: '2005-05-10', last_company_date: '2005-05-10', mapping_status: mapped}
        - {park_id: park2, game_year: 5, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: null, season_start: null, season_end: null, first_company_date: null, last_company_date: null, mapping_status: before_origin}
        - {park_id: park2, game_year: 6, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2003, season_start: '2003-03-01', season_end: '2003-10-31', first_company_date: '2003-06-04', last_company_date: '2003-10-31', mapping_status: mapped}
        - {park_id: park2, game_year: 7, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2004, season_start: '2004-03-01', season_end: '2004-10-31', first_company_date: '2004-07-06', last_company_date: '2004-07-06', mapping_status: mapped}
        - {park_id: park2, game_year: 8, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2005, season_start: '2005-03-01', season_end: '2005-10-31', first_company_date: '2005-08-09', last_company_date: '2005-08-09', mapping_status: mapped}
        - {park_id: park2, game_year: 9, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2006, season_start: '2006-03-01', season_end: '2006-10-31', first_company_date: '2006-07-05', last_company_date: '2006-09-25', mapping_status: mapped}
        - {park_id: park3, game_year: 1, data_set: null, company_start_year: null, game_year_origin: null, company_year: null, season_start: null, season_end: null, first_company_date: null, last_company_date: null, mapping_status: unregistered}
