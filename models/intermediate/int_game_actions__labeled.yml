version: 2

models:
  - name: int_game_actions__labeled
    description: >-
      Answers which game actions were the player's own, so a count of player actions never includes a build preview,
      a client-side prediction, a query or an action the plugin issued itself. Grain: one row per game_action event in
      stg_game_action, nothing filtered out, key event_id. Adds is_plugin_issued (the row's player is in the dbt variable
      plugin_issued_player_values, or its arguments carry the key analytics_issued_by; on OpenRCT2 0.5.6 the key does
      not reach the recorded arguments, so the player rule carries the provenance), is_player_action (hook is execute,
      the plugin's label is confirmed and the row is not plugin-issued) and is_refused (the result carries a non-zero
      error code). A refused attempt is still a player action; a consumer that wants successes filters on is_refused.
      The model has no unit of its own. Clocks by column group: the hook columns and the three labels are game, at the
      hook call; game_year, game_month, game_day, game_ticks_elapsed and the action_* date and tick columns are game;
      emitted_at and received_at are wall clock; the identity columns and seq have no clock.
    meta:
      expected_min_rows: 0
    data_tests:
      - rows_on_sample:
          arguments:
            expected: 0
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
      - name: event_type
        description: "Event kind (game_action here); text, no unit, no clock."
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
      - name: hook
        description: "Which action hook fired: query (would the action succeed) or execute (the game runs it); text, no unit; clock: game, at the hook call."
      - name: action
        description: "The game's name for the action, for example ridesetprice or ridesetstatus; plugin 0.8.0 and later send only business actions (ADR 0042), so build actions such as ridecreate appear only in rows from earlier plugins; text, no unit; clock: game, at the hook call."
      - name: action_label
        description: "The plugin's label (plugin 0.8.0 and later drop previews before sending, so preview appears only in rows from earlier plugins): preview when args_flags has bit 64 set, else prediction when is_client_only is true, else confirmed; text, no unit; clock: game, at the hook call."
      - name: args_flags
        description: "The arguments' flags integer as received; a bit set, no unit; clock: game, at the hook call. May be negative; null when the arguments carry no numeric flags."
      - name: is_client_only
        description: "The hook's isClientOnly value as received; true or false, no unit; clock: game, at the hook call."
      - name: player
        description: "The hook's player value, unchanged; a whole number, no unit; clock: game, at the hook call."
      - name: type
        description: "The hook's type value as received; a whole number, no unit; clock: game, at the hook call. Null when the hook gives none."
      - name: args_json
        description: "The hook's arguments as JSON text; text, no unit; clock: game, at the hook call."
      - name: args_ride
        description: "The ride number in the arguments; a whole number, no unit; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_ride_type
        description: "The ride type number in the arguments; a whole number, no unit; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_ride_object
        description: "The ride object number in the arguments; a whole number, no unit; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_price_usd
        description: "The price in the arguments in US dollars (decimal(18,2)), converted once from tenths of a dollar in stg_game_action and passed through unchanged here; unit: US dollars; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_x
        description: "The x coordinate in the arguments; unit: the action's own coordinate units; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_y
        description: "The y coordinate in the arguments; unit: the action's own coordinate units; clock: game, at the hook call. Null when the arguments carry none."
      - name: args_z
        description: "The z coordinate in the arguments; unit: the action's own coordinate units; clock: game, at the hook call. Null when the arguments carry none."
      - name: result_error
        description: "The result's error code as received; a whole number, no unit; clock: game, at the hook call. Null when the result carries none; read null as no error."
      - name: result_cost_usd
        description: "The result's cost in US dollars (decimal(18,2)), converted once from tenths of a dollar in stg_game_action and passed through unchanged here; unit: US dollars; clock: game, at the hook call. Null when the result carries none."
      - name: result_ride
        description: "The ride number the result returns; a whole number, no unit; clock: game, at the hook call. Null when the result carries none."
      - name: action_at_ticks
        description: "Game tick at which the hook fired; unit: game tick; clock: game."
      - name: action_game_year
        description: "In-game year read inside the hook, from 1; unit: year; clock: game calendar. Use this, not game_year, for an action's date."
      - name: action_game_month
        description: "In-game month read inside the hook, 0 to 7 (March = 0); unit: month; clock: game calendar."
      - name: action_game_day
        description: "In-game day of the month read inside the hook, from 1; unit: day; clock: game calendar."
      - name: is_plugin_issued
        description: "True when the row's player is in plugin_issued_player_values or its arguments carry the key analytics_issued_by (the key rule is inert on OpenRCT2 0.5.6, where the key does not reach the recorded arguments, so the player rule carries the provenance); true or false, no unit; clock: game, at the hook call."
        data_tests:
          - not_null
      - name: is_player_action
        description: "True when hook is execute, action_label is confirmed and is_plugin_issued is false; true or false, no unit; clock: game, at the hook call. Previews, predictions, queries and plugin-issued rows are false."
        data_tests:
          - not_null
      - name: is_refused
        description: "True when the result carries a non-zero error code (a null code reads as no error); true or false, no unit; clock: game, at the hook call."
        data_tests:
          - not_null

