version: 2

models:
  - name: int_sessions__lineage
    description: >-
      Answers which play sessions, and which part of each, are on the kept timeline after saves and reloads, so a
      later model can keep the events of the timeline the park actually followed and drop play that a reload
      abandoned. Grain: one row per session_id seen in stg_envelope, key session_id. Each session gets a load status
      and a parent; sessions form trees (a root, or the orphans of one park and one loaded save), each tree's most
      recently started session is its frontier, and the frontier with its ancestors is the kept path. Each kept-path
      session is cut at the save its kept-path child loaded, or, for a frontier, at its own last landed save; its
      events before the cut are kept. These labels change between builds when a later session starts, because the
      kept path follows the most recently started session; nothing is stored between builds. A session in a parent
      loop has a null tree_root_session_id, which a not_null test fails. The model has no unit; no clock, except
      session_started_at (wall clock, UTC) and the kept game ticks (game clock).
    meta:
      expected_min_rows: 1
    columns:
      - name: session_id
        description: "Plugin start identifier of the session; key; text; no unit; no clock."
        data_tests: [unique, not_null]
      - name: park_id
        description: "The park's identifier, the same text the plugin sends; no unit; no clock."
        data_tests: [not_null]
      - name: first_seq_is_one
        description: "True when the session's least landed seq is 1, false when its first events never landed; no unit; no clock."
        data_tests: [not_null]
      - name: has_session_start
        description: "True when the session's session_start event landed; no unit; no clock."
        data_tests: [not_null]
      - name: session_started_at
        description: "The session_start emitted_at; null without a session_start; no unit; clock: wall clock (UTC)."
      - name: loaded_save_id
        description: "Identifier of the save the session loaded, from session_start; null for a new game or without a session_start; text; no unit; no clock."
      - name: load_status
        description: "root (no loaded save), loaded (the loaded save's save_written landed), estimated (no save_written, but the writing session is in the data with a seq floor and waiting count) or orphan (otherwise); the first that applies in that order; text; no unit; no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [root, loaded, estimated, orphan]
      - name: parent_session_id
        description: "The session that wrote the loaded save; null for root and orphan; text; no unit; no clock."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_sessions__lineage')
                field: session_id
      - name: tree_root_session_id
        description: "The tree's root session, or for a tree of orphans of one park and one loaded save their earliest-started orphan (which can itself be off the kept path); null only for a session in a parent loop; text; no unit; no clock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_sessions__lineage')
                field: session_id
      - name: is_frontier
        description: "True for the most recently started session of its tree (a session with no session_start sorts first, equal start times go to the greater session_id); false for every other session, including one in a parent loop; no unit; no clock."
        data_tests: [not_null]
      - name: is_on_kept_path
        description: "True for a frontier and each of its ancestors. A session on the kept path can still hold abandoned events after its cut, so consumers label events only through the timeline_status macro, never from this column; no unit; no clock."
        data_tests: [not_null]
      - name: continued_by_session_id
        description: "The session's child on the kept path; null for a frontier and off the kept path; text; no unit; no clock."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_sessions__lineage')
                field: session_id
      - name: cut_seq
        description: "The session's cut: the seq of the save its kept-path child loaded (estimated as floor plus waiting plus one when that save's save_written is lost), or for a frontier the seq of its own last landed save_written; events with seq below it are kept; null off the kept path or for a frontier with no landed save; unit: count; no clock (session order, not a time)."
      - name: cut_is_estimated
        description: "True when cut_seq was estimated from a lost save's floor and waiting count; null when cut_seq is null; no unit; no clock."
      - name: first_kept_game_ticks
        description: "Least game_ticks_elapsed of the session's events with seq below cut_seq; null without a kept event; unit: game tick; clock: game."
      - name: last_kept_game_ticks
        description: "Greatest game_ticks_elapsed of the session's events with seq below cut_seq; null without a kept event; unit: game tick; clock: game."
      - name: overlaps_kept_session_id
        description: "The least session_id of another kept-path session of the same park whose kept ticks overlap this session's (each range's first kept tick strictly below the other's last); null when none; a singular test fails the build on any value; text; no unit; no clock."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_sessions__lineage')
                field: session_id

unit_tests:
  - name: int_sessions__lineage_u1_straight_chain_of_three
    description: >-
      It proves that in a straight chain of three sessions (sp a root, sa loading sp's save at seq 20, sc loading sa's
      save at seq 30), all three are on the kept path in one tree rooted at sp, the first two are cut at the save the
      next one loaded (sa at 30, not its own later save at 45; sa's floor plus waiting plus one is 19, so a loaded cut
      comes from the save's seq), the third is the frontier cut at its own last save (25, not 15) although sp has the
      greatest session_id, cut_is_estimated is false on all three, and the kept ticks stop before each cut.
    model: int_sessions__lineage
    given:
      - input: ref('stg_envelope')
        format: sql
        rows: |
          select cast('sp' as varchar) as session_id, cast('park1' as varchar) as park_id, cast(1 as bigint) as seq, cast(1000 as bigint) as game_ticks_elapsed
          union all
          select cast('sp' as varchar), cast('park1' as varchar), cast(10 as bigint), cast(1100 as bigint)
          union all
          select cast('sp' as varchar), cast('park1' as varchar), cast(20 as bigint), cast(1200 as bigint)
          union all
          select cast('sp' as varchar), cast('park1' as varchar), cast(21 as bigint), cast(1210 as bigint)
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(1 as bigint), cast(1201 as bigint)
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(10 as bigint), cast(1300 as bigint)
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(30 as bigint), cast(1400 as bigint)
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(45 as bigint), cast(1500 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(1 as bigint), cast(1401 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(15 as bigint), cast(1450 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(25 as bigint), cast(1480 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(26 as bigint), cast(1490 as bigint)
      - input: ref('stg_session_start')
        format: sql
        rows: |
          select cast('sp' as varchar) as session_id, cast('2026-10-01 09:00:00+00' as timestamp with time zone) as emitted_at, cast(null as varchar) as loaded_save_id, cast(null as varchar) as loaded_save_session_id, cast(null as bigint) as loaded_save_seq_floor, cast(null as integer) as loaded_save_lines_waiting
          union all
          select cast('sa' as varchar), cast('2026-10-01 10:00:00+00' as timestamp with time zone), cast('vp20' as varchar), cast('sp' as varchar), cast(17 as bigint), cast(1 as integer)
          union all
          select cast('sc' as varchar), cast('2026-10-01 11:00:00+00' as timestamp with time zone), cast('va30' as varchar), cast('sa' as varchar), cast(29 as bigint), cast(0 as integer)
      - input: ref('stg_save_written')
        format: sql
        rows: |
          select cast('vp20' as varchar) as save_id, cast('sp' as varchar) as session_id, cast(20 as bigint) as seq
          union all
          select cast('va30' as varchar), cast('sa' as varchar), cast(30 as bigint)
          union all
          select cast('va45' as varchar), cast('sa' as varchar), cast(45 as bigint)
          union all
          select cast('vc15' as varchar), cast('sc' as varchar), cast(15 as bigint)
          union all
          select cast('vc25' as varchar), cast('sc' as varchar), cast(25 as bigint)
    expect:
      rows:
        - {session_id: sa, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 10:00:00+00', loaded_save_id: vp20, load_status: loaded, parent_session_id: sp, tree_root_session_id: sp, is_frontier: false, is_on_kept_path: true, continued_by_session_id: sc, cut_seq: 30, cut_is_estimated: false, first_kept_game_ticks: 1201, last_kept_game_ticks: 1300, overlaps_kept_session_id: null}
        - {session_id: sc, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 11:00:00+00', loaded_save_id: va30, load_status: loaded, parent_session_id: sa, tree_root_session_id: sp, is_frontier: true, is_on_kept_path: true, continued_by_session_id: null, cut_seq: 25, cut_is_estimated: false, first_kept_game_ticks: 1401, last_kept_game_ticks: 1450, overlaps_kept_session_id: null}
        - {session_id: sp, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 09:00:00+00', loaded_save_id: null, load_status: root, parent_session_id: null, tree_root_session_id: sp, is_frontier: false, is_on_kept_path: true, continued_by_session_id: sa, cut_seq: 20, cut_is_estimated: false, first_kept_game_ticks: 1000, last_kept_game_ticks: 1100, overlaps_kept_session_id: null}

  - name: int_sessions__lineage_u2_fork_later_start_wins
    description: >-
      It proves that when sb and sc both load sa's save at seq 20, the later session_start emitted_at wins even though
      it belongs to the smaller session_id and received_at runs the opposite way: sb is the frontier and on the kept
      path with sa, sa is cut at 20 and continued by sb, and sc is off the kept path with null cut and tick columns. A
      frontier ordered by session_id or by received_at picks sc and fails.
    model: int_sessions__lineage
    given:
      - input: ref('stg_envelope')
        format: sql
        rows: |
          select cast('sa' as varchar) as session_id, cast('park1' as varchar) as park_id, cast(1 as bigint) as seq, cast(1000 as bigint) as game_ticks_elapsed
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(10 as bigint), cast(1100 as bigint)
          union all
          select cast('sa' as varchar), cast('park1' as varchar), cast(20 as bigint), cast(1200 as bigint)
          union all
          select cast('sb' as varchar), cast('park1' as varchar), cast(1 as bigint), cast(1201 as bigint)
          union all
          select cast('sb' as varchar), cast('park1' as varchar), cast(8 as bigint), cast(1260 as bigint)
          union all
          select cast('sb' as varchar), cast('park1' as varchar), cast(12 as bigint), cast(1300 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(1 as bigint), cast(1202 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(9 as bigint), cast(1270 as bigint)
          union all
          select cast('sc' as varchar), cast('park1' as varchar), cast(14 as bigint), cast(1310 as bigint)
      - input: ref('stg_session_start')
        format: sql
        rows: |
          select cast('sa' as varchar) as session_id, cast('2026-10-01 09:00:00+00' as timestamp with time zone) as emitted_at, cast('2026-10-01 09:01:00+00' as timestamp with time zone) as received_at, cast(null as varchar) as loaded_save_id, cast(null as varchar) as loaded_save_session_id, cast(null as bigint) as loaded_save_seq_floor, cast(null as integer) as loaded_save_lines_waiting
          union all
          select cast('sb' as varchar), cast('2026-10-01 11:00:00+00' as timestamp with time zone), cast('2026-10-01 11:05:00+00' as timestamp with time zone), cast('va20' as varchar), cast('sa' as varchar), cast(19 as bigint), cast(0 as integer)
          union all
          select cast('sc' as varchar), cast('2026-10-01 10:00:00+00' as timestamp with time zone), cast('2026-10-01 11:10:00+00' as timestamp with time zone), cast('va20' as varchar), cast('sa' as varchar), cast(18 as bigint), cast(1 as integer)
      - input: ref('stg_save_written')
        format: sql
        rows: |
          select cast('va20' as varchar) as save_id, cast('sa' as varchar) as session_id, cast(20 as bigint) as seq
          union all
          select cast('vb12' as varchar), cast('sb' as varchar), cast(12 as bigint)
          union all
          select cast('vc14' as varchar), cast('sc' as varchar), cast(14 as bigint)
    expect:
      rows:
        - {session_id: sa, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 09:00:00+00', loaded_save_id: null, load_status: root, parent_session_id: null, tree_root_session_id: sa, is_frontier: false, is_on_kept_path: true, continued_by_session_id: sb, cut_seq: 20, cut_is_estimated: false, first_kept_game_ticks: 1000, last_kept_game_ticks: 1100, overlaps_kept_session_id: null}
        - {session_id: sb, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 11:00:00+00', loaded_save_id: va20, load_status: loaded, parent_session_id: sa, tree_root_session_id: sa, is_frontier: true, is_on_kept_path: true, continued_by_session_id: null, cut_seq: 12, cut_is_estimated: false, first_kept_game_ticks: 1201, last_kept_game_ticks: 1260, overlaps_kept_session_id: null}
        - {session_id: sc, park_id: park1, first_seq_is_one: true, has_session_start: true, session_started_at: '2026-10-01 10:00:00+00', loaded_save_id: va20, load_status: loaded, parent_session_id: sa, tree_root_session_id: sa, is_frontier: false, is_on_kept_path: false, continued_by_session_id: null, cut_seq: null, cut_is_estimated: null, first_kept_game_ticks: null, last_kept_game_ticks: null, overlaps_kept_session_id: null}

