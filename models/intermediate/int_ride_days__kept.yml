version: 2

models:
  - name: int_ride_days__kept
    description: >-
      Answers how each ride, stall and facility was read and how its guest and
      profit counters rose on each kept game day, so abandoned save history does
      not count. Grain: one row per ride occupancy per game day on the kept
      timeline; key ride_day_key, ride_key joined with game_year, game_month and
      game_day. An occupancy is one stretch of a ride slot; a new one starts on
      the slot's first reading, on a change of build month, ride type, ride
      object or classification, or on a fall in total_customers. ride_key joins
      park_id, ride_id, the build month and the occupancy's first tick. The
      snapshot columns come from the occupancy's last kept reading of the day
      (greatest tick, then latest session start, then session_id, then seq); the
      two counter changes are each reading's rise to the next kept reading of the
      same session and occupancy, summed over the day's kept readings, so no rise
      is lost when a same-day reading is dropped. Known limits: a replacement
      with the same type, object, classification and build month whose
      total_customers is at or above its predecessor's last reading shares the
      predecessor's key; two occupancies of one slot first seen at a tick two
      kept sessions share, with one build month, share a ride_key and fail the
      unique test on ride_day_key. Unit: none for the model as a whole; clock:
      company date (day) for readings and company date for company_date. On
      the zero-row build the model is empty because there are no ride
      snapshots.
    meta:
      expected_min_rows: 1
    data_tests:
      - rows_on_sample:
          arguments:
            expected: 3045
    columns:
      - name: ride_day_key
        description: "Ride key and game date joined by pipes; text, no unit; clock: game day."
        data_tests:
          - unique:
              config:
                severity: error
          - not_null
      - name: ride_key
        description: "Park, ride slot, build month and first tick of the occupancy joined by pipes; text, no unit; clock: game."
        data_tests: [not_null]
      - name: park_day_key
        description: "Park identifier and game date joined by pipes, the key of the park-day; text, no unit; clock: game day."
        data_tests: [not_null]
      - name: park_id
        description: "Stable identifier for the park save; text, no unit; no clock."
        data_tests: [not_null]
      - name: ride_id
        description: "Ride slot number within the park, which the game can reuse; unit: slot number; no clock."
        data_tests: [not_null]
      - name: session_id
        description: "Plugin start identifier of the day's chosen reading, new on every start; text, no unit; clock: session."
        data_tests: [not_null]
      - name: seq
        description: "Order of the chosen reading within its session across event types; unit: count; clock: session order."
        data_tests: [not_null]
      - name: event_id
        description: "Unique identifier for the source ride snapshot of the chosen reading; text, no unit; clock: event."
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year; unit: year; clock: game calendar."
        data_tests: [not_null]
      - name: game_month
        description: "In-game month numbered 0 to 7; unit: month; clock: game calendar."
        data_tests: [not_null]
      - name: game_day
        description: "In-game day of the month; unit: day; clock: game calendar."
        data_tests: [not_null]
      - name: game_ticks_elapsed
        description: "Game ticks elapsed since the park began, at the chosen reading; unit: game tick; clock: game."
        data_tests: [not_null]
      - name: first_seen_ticks
        description: "Least game ticks elapsed over the occupancy's kept readings; unit: game tick; clock: game."
        data_tests: [not_null]
      - name: company_year
        description: "Mapped company year for this game day; unit: year; clock: company date."
        data_tests: [not_null]
      - name: company_date
        description: "Company calendar date for the game day; unit: date; clock: company date."
        data_tests: [not_null]
      - name: ride_name
        description: "Name the player gave the attraction, at the chosen reading; text, no unit; clock: company date (day)."
      - name: classification
        description: "Whether the attraction is a ride, a stall or a facility; text, no unit; clock: company date (day)."
      - name: ride_type
        description: "The game's ride type code; unit: code; clock: company date (day)."
      - name: ride_object
        description: "The game's object identifier for the attraction; text, no unit; clock: company date (day)."
      - name: build_date_months_elapsed
        description: "Months from the park's start to the attraction's build date; unit: month; clock: game."
      - name: status
        description: "Operating status named by the game; text, no unit; clock: company date (day), at the chosen reading."
      - name: is_open_day
        description: "True when status is open at the chosen reading; boolean, no unit; clock: company date (day)."
      - name: ride_age_months
        description: "Age of the attraction at the chosen reading; unit: month; clock: company date (day)."
      - name: excitement_hundredths
        description: "Excitement rating in hundredths of a rating point; unit: hundredths of a rating point; clock: company date (day)."
      - name: intensity_hundredths
        description: "Intensity rating in hundredths of a rating point; unit: hundredths of a rating point; clock: company date (day)."
      - name: nausea_hundredths
        description: "Nausea rating in hundredths of a rating point; unit: hundredths of a rating point; clock: company date (day)."
      - name: price_1_usd
        description: "Listed first price when read, not the amount charged; unit: US dollar; clock: company date (day)."
      - name: price_2_usd
        description: "Listed second price when read, not the amount charged; unit: US dollar; clock: company date (day)."
      - name: ride_price_listed_usd
        description: "Listed price of a ride, equal to price_1_usd when classification is ride and null otherwise; unit: US dollar; clock: company date (day)."
      - name: shop_item
        description: "The game's code for the first item a stall or facility sells; unit: item code; clock: company date (day)."
      - name: shop_item_secondary
        description: "The game's code for the second item a stall or facility sells; unit: item code; clock: company date (day)."
      - name: total_customers
        description: "Lifetime guests served at the chosen reading, which a reload can rewind; unit: count of guests; clock: company date (day)."
      - name: customers_increase
        description: "Rise in the game's guest counter from each of this game day's kept readings to the next kept reading of the same session and occupancy, summed over the day; null when no kept reading of the day has a later one (always on a session's last reading). On a ride row it counts guests leaving the ride plus on-ride photos sold; on a stall row it counts purchases; unit: guests; clock: company date (day), assigned to the game day of the earlier reading."
      - name: total_profit_usd
        description: "Lifetime profit at the chosen reading; unit: US dollar; clock: company date (day)."
      - name: profit_usd
        description: "Sum, over this occupancy's kept readings on this game day, of each reading's rise in total_profit_usd to the next kept reading of the same session and occupancy, which may be negative; null only when every such rise is null; unit: US dollar; clock: company date (day), assigned to the game day of the earlier reading."

      - name: availability_from_downtime_pct
        description: "100 minus the game's downtime reading at the day's last kept reading; the game computes downtime over its own window, which the repo does not record, so this is not a share measured over this game day; time the ride stood closed may not count as downtime, so a ride closed all day can read 100; null for stalls and facilities and when the reading is null; unit: percent; clock: company date (day), the day's last kept reading."
      - name: longest_queue_seen_minutes
        description: "Longest queue seen at the day's kept readings, the largest queue time among the used stations; a longer queue between readings is not seen; null when every reading of the day is null (no station in use) and for stalls and facilities; unit: minutes as the game reports them; clock: company date (day)."
      - name: guest_rating_pct
        description: "The game's guest satisfaction rating at the day's last kept reading, not the excitement, intensity or nausea ratings; null when not yet measured and for stalls and facilities; unit: percent, 0 to 100; clock: company date (day), the day's last kept reading."

