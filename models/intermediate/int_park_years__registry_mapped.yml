version: 2

models:
  - name: int_park_years__registry_mapped
    description: >-
      Answers which company year each park's game year belongs to, including years that have a monthly statement
      but no landed day. Grain: one row per park and game year in stg_envelope or stg_finance_month; key
      park_year_key, park_id joined with game_year. The company year is company_start_year +
      (game_year - game_year_origin) from the park's current registry row. A park-year that cannot map keeps its row
      with mapping_status unregistered (no current registry row) or before_origin (game year before the origin), and
      its company_year is null. The model has no unit; clock: game calendar for game_year, company date for
      company_year. On the zero-row build the model is empty because there are no envelope or statement rows.
    meta:
      expected_min_rows: 1
    data_tests:
      - unique:
          column_name: park_year_key
      - rows_on_sample:
          arguments:
            expected: 1
    columns:
      - name: park_year_key
        description: "Park identifier and game year joined by a pipe; text; no unit; no clock."
        data_tests: [not_null]
      - name: park_id
        description: "The park's identifier, the same text the plugin sends; no unit; no clock."
        data_tests: [not_null]
      - name: game_year
        description: "In-game year found in a landed envelope or monthly statement, from 1; unit: year; clock: game calendar."
        data_tests: [not_null]
      - name: data_set
        description: "Data set the park's registry row names, rehearsal or company; null when unregistered; text; no unit; no clock."
      - name: company_start_year
        description: "Company calendar year of the park's first game year, from its current registry row; null when unregistered; unit: year; clock: company date."
      - name: game_year_origin
        description: "Game year that counts as the park's first company year, from its current registry row; null when unregistered; unit: game year; clock: game calendar."
      - name: company_year
        description: "company_start_year + (game_year - game_year_origin); null unless mapping_status is mapped; unit: year; clock: company date."
      - name: mapping_status
        description: "mapped, unregistered or before_origin; one of three values, the first that applies in the order unregistered, before_origin, mapped; text; no unit; no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unregistered, before_origin, mapped]

unit_tests:
  - name: int_park_years__registry_mapped_maps_landed_and_statement_years
    description: >-
      It proves that duplicate landed years collapse, statement-only years are included, the company year follows
      the current registry row for two parks, and an unregistered park-year remains visible without a company year.
    model: int_park_years__registry_mapped
    given:
      - input: ref('stg_envelope')
        format: sql
        rows: |
          select cast('park1' as varchar) as park_id, cast(9 as integer) as game_year
          union all
          select cast('park1' as varchar), cast(9 as integer)
          union all
          select cast('park1' as varchar), cast(10 as integer)
          union all
          select cast('park1' as varchar), cast(8 as integer)
          union all
          select cast('park2' as varchar), cast(7 as integer)
          union all
          select cast('park3' as varchar), cast(1 as integer)
      - input: ref('stg_finance_month')
        format: sql
        rows: |
          select cast('park1' as varchar) as park_id, cast(9 as integer) as statement_year
          union all
          select cast('park2' as varchar), cast(6 as integer)
      - input: ref('int_park_registry__current')
        format: sql
        rows: |
          select cast('park1' as varchar) as park_id, cast(2000 as integer) as company_start_year, cast(9 as integer) as game_year_origin, cast('rehearsal' as varchar) as data_set
          union all
          select cast('park2' as varchar), cast(2003 as integer), cast(6 as integer), cast('rehearsal' as varchar)
    expect:
      rows:
        - {park_year_key: 'park1|8', park_id: park1, game_year: 8, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: null, mapping_status: before_origin}
        - {park_year_key: 'park1|9', park_id: park1, game_year: 9, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2000, mapping_status: mapped}
        - {park_year_key: 'park1|10', park_id: park1, game_year: 10, data_set: rehearsal, company_start_year: 2000, game_year_origin: 9, company_year: 2001, mapping_status: mapped}
        - {park_year_key: 'park2|6', park_id: park2, game_year: 6, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2003, mapping_status: mapped}
        - {park_year_key: 'park2|7', park_id: park2, game_year: 7, data_set: rehearsal, company_start_year: 2003, game_year_origin: 6, company_year: 2004, mapping_status: mapped}
        - {park_year_key: 'park3|1', park_id: park3, game_year: 1, data_set: null, company_start_year: null, game_year_origin: null, company_year: null, mapping_status: unregistered}
