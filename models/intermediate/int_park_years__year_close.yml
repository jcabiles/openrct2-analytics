  - name: int_park_years__year_close_marks_a_gap_before_a_kept_month_incomplete_in_the_same_year
    description: >-
      It proves that, with no statement in a later year, a park missing month 2 while months 3 and 4 are kept is
      incomplete in the same company year, while a park whose only missing months come after its last kept month is
      open, and that the company year does not close.
    model: int_park_years__year_close
    given:
      - input: ref('int_park_registry__current')
        format: sql
        rows: |
          select cast('park_n' as varchar) as park_id, cast(2000 as integer) as company_start_year
          union all
          select cast('park_o' as varchar), cast(2000 as integer)
      - input: ref('int_park_years__registry_mapped')
        format: sql
        rows: |
          select cast('park_n' as varchar) as park_id, cast(9 as integer) as game_year, cast(2000 as integer) as company_year
          union all
          select cast('park_o' as varchar), cast(9 as integer), cast(2000 as integer)
      - input: ref('stg_park_snapshot')
        format: sql
        rows: |
          select cast('park_n' as varchar) as park_id, cast(9 as integer) as game_year, cast(0 as integer) as game_month, cast(1 as integer) as game_day
          union all
          select cast('park_o' as varchar), cast(9 as integer), cast(0 as integer), cast(1 as integer)
      - input: ref('fct_park_month')
        format: sql
        rows: |
          select cast('park_n' as varchar) as park_id, cast(2000 as integer) as company_year, cast(m as integer) as statement_month
          from generate_series(0, 4) as months (m)
          where m <> 2
          union all
          select cast('park_o' as varchar), cast(2000 as integer), cast(m as integer)
          from generate_series(0, 4) as months (m)
    expect:
      rows:
        - {park_id: 'park_n', company_year: 2000, close_status: 'incomplete', is_company_year_closed: false, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 4, missing_statement_months: '2,5,6,7', has_later_statement: false, has_kept_month_after_gap: true}
        - {park_id: 'park_o', company_year: 2000, close_status: 'open', is_company_year_closed: false, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 5, missing_statement_months: '5,6,7', has_later_statement: false, has_kept_month_after_gap: false}

