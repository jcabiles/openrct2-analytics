version: 2

models:
  - name: int_park_years__year_close
    description: >-
      Answers whether each expected park has closed each company year, and whether the company year as a whole is
      closed, so a company-year figure is published only from a year no park can still change. Not yet reconciled:
      the register counts kept monthly statements and does not tie them to a ledger or an outside report.
      Grain: one row per registered park and company year, from the park's company_start_year in the current
      registry to the latest company year with a kept statement in any park; key park_year_close_key. A park is
      expected from its first full company year. Its partial first season (first captured day in game month 1 or
      later of its start year) has status partial_first_season, is exempt, and never holds a year open.
      Otherwise the status is complete (all eight statements kept), incomplete (a statement is missing and the park
      has a kept statement in a later company year, or a kept month of the same year comes after a missing reportable
      month) or open (every missing reportable month comes after the last kept month of the year, which includes a
      year with nothing kept, and no later statement exists).
      A company year is closed only when no park is open or incomplete and at least one park is complete.
      Unit: statements, years; clock: company date (year).
    meta:
      expected_min_rows: 1
    data_tests:
      - rows_on_sample:
          arguments:
            expected: 1
    columns:
      - name: park_year_close_key
        description: "Park ID, a vertical bar and the company year; text; no unit; clock: company date (year)."
        data_tests:
          - unique
          - not_null
      - name: park_id
        description: "The park's identifier, the same text the plugin sends; no unit; no clock."
        data_tests: [not_null]
      - name: company_year
        description: "Company year the row covers; unit: year; clock: company date (year)."
        data_tests: [not_null]
      - name: first_captured_company_year
        description: "Company year of the park's earliest snapshot on any timeline; null when the park has no snapshot or its game year cannot map; unit: year; clock: company date (year)."
      - name: is_partial_first_season
        description: "True when this is the park's start year and its first captured day is in that year at game month 1 or later; true or false; no unit; clock: company date (year)."
        data_tests: [not_null]
      - name: first_reportable_month
        description: "First game month the park could report this year: the first captured day's month for a partial first season, else 0; unit: game month, 0 is March; clock: game calendar."
        data_tests: [not_null]
      - name: statements_expected
        description: "Statements the park owes this year, 8 minus first_reportable_month; unit: statements; clock: company date (year)."
        data_tests: [not_null]
      - name: statements_kept
        description: "Distinct game months with a kept statement this year; unit: statements; clock: company date (year)."
        data_tests: [not_null]
      - name: missing_statement_months
        description: "Game months from first_reportable_month to 7 with no kept statement, ascending and comma-separated, empty when none; shown but not owed for a partial first season; text; unit: game month, 0 is March; clock: game calendar."
        data_tests: [not_null]
      - name: has_later_statement
        description: "True when the park has a kept statement in a later company year; true or false; no unit; clock: company date (year)."
        data_tests: [not_null]
      - name: has_kept_month_after_gap
        description: "True when the park's latest kept month this year is later than its earliest missing reportable month; false when nothing is missing; months before first_reportable_month never count; ignored for a partial first season; true or false; no unit; clock: game calendar within the company year."
        data_tests: [not_null]
      - name: close_status
        description: "partial_first_season, complete, incomplete or open, the first that applies in that order; incomplete when a later year has a kept statement or a kept month of this year comes after a missing reportable month, open when every missing reportable month comes after the last kept month; text; no unit; clock: company date (year)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [complete, incomplete, open, partial_first_season]
      - name: is_company_year_closed
        description: "True on every row of a company year in which no park is open or incomplete and at least one is complete; true or false; no unit; clock: company date (year)."
        data_tests: [not_null]


unit_tests:
  - name: int_park_years__year_close_closes_with_a_partial_park
    description: >-
      It proves that two parks with months 0 to 7 close their company year even when a third park is in its partial
      first season, which is flagged, owes only its remaining months and never holds the year open, and that the next
      year stays open with all three parks expected.
    model: int_park_years__year_close
    given:
      - input: ref('int_park_registry__current')
        format: sql
        rows: |
          select cast('park_a' as varchar) as park_id, cast(2000 as integer) as company_start_year
          union all
          select cast('park_b' as varchar), cast(2000 as integer)
          union all
          select cast('park_c' as varchar), cast(2000 as integer)
      - input: ref('int_park_years__registry_mapped')
        format: sql
        rows: |
          select cast('park_a' as varchar) as park_id, cast(9 as integer) as game_year, cast(2000 as integer) as company_year
          union all
          select cast('park_a' as varchar), cast(10 as integer), cast(2001 as integer)
          union all
          select cast('park_b' as varchar), cast(4 as integer), cast(2000 as integer)
          union all
          select cast('park_b' as varchar), cast(5 as integer), cast(2001 as integer)
          union all
          select cast('park_c' as varchar), cast(1 as integer), cast(2000 as integer)
      - input: ref('stg_park_snapshot')
        format: sql
        rows: |
          select cast('park_a' as varchar) as park_id, cast(9 as integer) as game_year, cast(0 as integer) as game_month, cast(1 as integer) as game_day
          union all
          select cast('park_b' as varchar), cast(4 as integer), cast(0 as integer), cast(1 as integer)
          union all
          select cast('park_c' as varchar), cast(1 as integer), cast(3 as integer), cast(2 as integer)
      - input: ref('fct_park_month')
        format: sql
        rows: |
          select cast('park_a' as varchar) as park_id, cast(2000 as integer) as company_year, cast(0 as integer) as statement_month
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(1 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(2 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(3 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(4 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(5 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(6 as integer)
          union all
          select cast('park_a' as varchar), cast(2000 as integer), cast(7 as integer)
          union all
          select cast('park_a' as varchar), cast(2001 as integer), cast(0 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(0 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(1 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(2 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(3 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(4 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(5 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(6 as integer)
          union all
          select cast('park_b' as varchar), cast(2000 as integer), cast(7 as integer)
          union all
          select cast('park_b' as varchar), cast(2001 as integer), cast(0 as integer)
          union all
          select cast('park_c' as varchar), cast(2000 as integer), cast(3 as integer)
          union all
          select cast('park_c' as varchar), cast(2000 as integer), cast(4 as integer)
    expect:
      rows:
        - {park_id: 'park_a', company_year: 2000, close_status: 'complete', is_company_year_closed: true, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 8, missing_statement_months: '', has_later_statement: true}
        - {park_id: 'park_b', company_year: 2000, close_status: 'complete', is_company_year_closed: true, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 8, missing_statement_months: '', has_later_statement: true}
        - {park_id: 'park_c', company_year: 2000, close_status: 'partial_first_season', is_company_year_closed: true, first_captured_company_year: 2000, is_partial_first_season: true, first_reportable_month: 3, statements_expected: 5, statements_kept: 2, missing_statement_months: '5,6,7', has_later_statement: false}
        - {park_id: 'park_a', company_year: 2001, close_status: 'open', is_company_year_closed: false, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 1, missing_statement_months: '1,2,3,4,5,6,7', has_later_statement: false}
        - {park_id: 'park_b', company_year: 2001, close_status: 'open', is_company_year_closed: false, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 1, missing_statement_months: '1,2,3,4,5,6,7', has_later_statement: false}
        - {park_id: 'park_c', company_year: 2001, close_status: 'open', is_company_year_closed: false, first_captured_company_year: 2000, is_partial_first_season: false, first_reportable_month: 0, statements_expected: 8, statements_kept: 0, missing_statement_months: '0,1,2,3,4,5,6,7', has_later_statement: false}

