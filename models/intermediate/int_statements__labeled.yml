version: 2

models:
  - name: int_statements__labeled
    description: >-
      Answers which monthly statements are on the kept timeline and which company month each one closes, so a monthly
      figure is read only for a statement a later model can place on the company calendar. Grain: one row per
      statement event in stg_finance_month, kept or abandoned, key event_id. Nothing is filtered out: the kept
      selection is done downstream with timeline_status = 'kept', and one park and month holds at most one kept row.
      Labels are recomputed on every build, so a statement can change from kept to abandoned when a later session
      starts. The company year comes from int_park_years__registry_mapped for the statement_year, and the statement
      date is the first day of the company month the statement closes; both are null unless mapping_status is mapped.
      The event's own game_year is never used. The model has no unit of its own (the
      money columns are in dollars, as in stg_finance_month); clock: company date for its dates, game calendar for
      statement_year and statement_month.
    meta:
      expected_min_rows: 1
    data_tests:
      - unique:
          column_name: "park_id || '|' || statement_year || '|' || statement_month"
          config:
            where: "timeline_status = 'kept'"
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
      - name: event_type
        description: "Event kind (finance_month here); text, no unit, no clock."
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_tests: [not_null]
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_sessions__lineage')
                field: session_id
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
      - name: event_id
        description: "session_id-seq; text, one per row after the dedupe; no unit, no clock."
        data_tests: [unique, not_null]
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
      - name: game_ticks_elapsed
        description: "Game ticks since the park began, the tick at which the month closed; unit: game tick; clock: game."
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
      - name: received_at
        description: "Listener time when the line landed, the first key of the dedupe order; unit: timestamp (UTC); clock: wall clock."
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
      - name: statement_year
        description: "In-game year of the closed month, from 1; unit: year; clock: game calendar."
        data_tests: [not_null]
      - name: statement_month
        description: "In-game month that closed, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_tests: [not_null]
      - name: ride_construction_usd
        description: "The closed game month's ride construction total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: ride_runningcosts_usd
        description: "The closed game month's ride runningcosts total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: land_purchase_usd
        description: "The closed game month's land purchase total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: landscaping_usd
        description: "The closed game month's landscaping total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: park_entrance_tickets_usd
        description: "The closed game month's park entrance tickets total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: park_ride_tickets_usd
        description: "The closed game month's ride tickets total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: shop_sales_usd
        description: "The closed game month's shop sales total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: shop_stock_usd
        description: "The closed game month's shop stock total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: food_drink_sales_usd
        description: "The closed game month's food drink sales total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: food_drink_stock_usd
        description: "The closed game month's food drink stock total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: wages_usd
        description: "The closed game month's staff wages total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: marketing_usd
        description: "The closed game month's marketing total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: research_usd
        description: "The closed game month's research total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: interest_usd
        description: "The closed game month's loan interest total in US dollars (decimal(18,2)); income positive and spending negative, and a refund can make a spending line positive; unit: US dollars; clock: game calendar month."
      - name: cash_usd
        description: "Park cash in US dollars (decimal(18,2)), may be negative; a balance at the reading, the day-1 callback of the month after the statement month, which runs at the end of that month's first tick, so it can include the money already booked to the new month (new_month_booked_usd); unit: US dollars; clock: game calendar."
      - name: bank_loan_usd
        description: "Bank loan outstanding in US dollars (decimal(18,2)), never negative; a balance at the reading, the day-1 callback of the month after the statement month, which runs at the end of that month's first tick, so it can include the money already booked to the new month (new_month_booked_usd); unit: US dollars; clock: game calendar."
      - name: new_month_booked_usd
        description: "The money already booked to the new month when the statement was read, in US dollars (decimal(18,2)); signed like the ledger lines; null for statements from plugins before 0.6.0, which do not send it; unit: US dollars; clock: game calendar."
      - name: company_start_year
        description: "Company calendar year of the park's first game year, from int_park_years__registry_mapped; null when unregistered; unit: year; clock: company date."
      - name: game_year_origin
        description: "Game year that counts as the park's first company year, from int_park_years__registry_mapped; null when unregistered; unit: game year; clock: game calendar."
      - name: company_year
        description: "Company year from int_park_years__registry_mapped for statement_year; null unless mapping_status is mapped; unit: year; clock: company date."
      - name: statement_company_date
        description: "First day of the company month the statement closes: month statement_month + 3 of company_year; null unless mapped; no unit; clock: company date."
      - name: mapping_status
        description: "mapped, unregistered, before_origin or game_month_out_of_range; one of four values, the first that applies in that order of unregistered, before_origin, game_month_out_of_range; text; no unit; no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mapped, unregistered, before_origin, game_month_out_of_range]
      - name: timeline_status
        description: "kept when the statement's session is on the kept path and its seq is below the session's cut, else abandoned; recomputed every build; text; no unit; no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [kept, abandoned]

