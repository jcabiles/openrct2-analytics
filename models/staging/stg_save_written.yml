version: 2

models:
  - name: stg_save_written
    description: >-
      Answers which saves the plugin made and where each one cut its session, so a later session that loads
      a save can be tied to the events that came before it. Grain: one row per save_written event, kept once
      per event_id (the earliest delivery by received_at, _raw_file, _raw_line). Key: event_id, and save_id
      is unique on its own. Renames and casts only; it holds no money column. The model has no unit and no
      clock of its own; each column names its own.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'save_written')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (save_written here); text, no unit, no clock."
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_tests:
          - not_null
      - name: save_id
        description: "Save identifier the plugin minted in the save hook and stored in the saved file; text, no unit, no clock. Minted once per save, so it is the grain on its own."
        data_tests:
          - not_null
          - unique

