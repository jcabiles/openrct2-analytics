version: 2

models:
  - name: stg_guest_arrived
    description: >-
      Answers which guests the game's guest-generation hook reported while the plugin ran, and how much cash each
      carried, so guest questions start from one clean row per arrival. A generated guest may never enter the park;
      whether it did is on stg_guest_left.entered_park. Grain: one row per guest_arrived event, kept once per
      event_id (the earliest delivery by received_at, _raw_file, _raw_line). Key: event_id. A guest is the pair
      (session_id, guest_key); guest_id is a reused game slot, not an identity. The envelope tick
      game_ticks_elapsed can trail generated_at_ticks by a few ticks, because the plugin records the arrival
      at the next step it runs. A guest generated while the plugin was not running has no row. Renames and
      casts only, except guest cash, which is converted from tenths of a dollar to dollars here, once.
      The model has no unit and no clock of its own; each column names its own.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    config:
      contract:
        enforced: true
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'guest_arrived')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (guest_arrived here); text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_type: bigint
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_type: bigint
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_type: bigint
        data_tests:
          - not_null
      - name: guest_key
        description: "Guest identifier the plugin minted, from 1, unique within one session; with session_id it names a guest; a whole number, no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: guest_id
        description: "The game's guest entity slot number, a whole number; the game reuses a slot, so it is not an identity (use guest_key); no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: generated_at_ticks
        description: "Game tick at which the generation hook fired; unit: game tick; clock: game. Not the envelope's game_ticks_elapsed, which is the tick the event was built."
        data_type: bigint
        data_tests:
          - not_null
      - name: in_cohort
        description: "Whether the guest was chosen for the daily guest_snapshot cohort; true or false, no unit, no clock."
        data_type: boolean
        data_tests:
          - not_null
      - name: guest_cash_usd
        description: "The guest's cash when the arrival step ran, converted once from tenths of a dollar; unit: US dollars; clock: game, at the arrival step. Null when the entity was no longer a guest at that step."
        data_type: decimal(18,2)

