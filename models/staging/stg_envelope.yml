version: 2

models:
  - name: stg_envelope
    description: >-
      Answers how many events landed, of which type, in which session and when, so the counting
      models can be checked against what the listener received. Grain: one row per landed delivery
      of any event type, with no dedupe, so an event delivered twice is two rows. Key: none on
      event_id, because a repeat delivery repeats it; a delivery is told apart by _raw_file and
      _raw_line. It holds only the envelope columns shared by every event type; no unit, no clock.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'plugin_stats')
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'weather_change')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind, one of the 13 contracted event types; text, no unit, no clock."
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, repeated when the same event landed more than once; no unit, no clock."
        data_tests:
          - not_null
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_tests:
          - not_null

unit_tests:
  - name: stg_envelope_keeps_repeat_deliveries
    description: It proves a repeat delivery of one event_id stays two rows and other event types pass through, so the envelope does not dedupe.
    model: stg_envelope
    given:
      - input: source('landing', 'finance_month')
        format: sql
        rows: |
          select
            cast(1 as integer) as schema_version, cast('finance_month' as varchar) as event_type, cast('0.3.0' as varchar) as plugin_version,
            cast('kpark1' as varchar) as park_id, cast('s1' as varchar) as session_id, cast(1 as bigint) as seq, cast('s1-1' as varchar) as event_id,
            cast(2 as integer) as game_year, cast(3 as integer) as game_month, cast(4 as integer) as game_day, cast(1000 as bigint) as game_ticks_elapsed,
            cast('2026-09-30 23:30:00+00' as timestamptz) as emitted_at, cast('2026-09-30 23:31:00+00' as timestamptz) as received_at,
            cast('a.jsonl' as varchar) as _raw_file, cast(1 as bigint) as _raw_line
          where false
      - input: source('landing', 'game_action')
