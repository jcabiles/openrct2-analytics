        rows: |
          select
            cast(1 as integer) as schema_version, cast('game_action' as varchar) as event_type, cast('0.7.0' as varchar) as plugin_version,
            cast('kpark1' as varchar) as park_id, cast('s1' as varchar) as session_id, cast(9 as bigint) as seq, cast('s1-9' as varchar) as event_id,
            cast(2 as integer) as game_year, cast(3 as integer) as game_month, cast(4 as integer) as game_day, cast(9*1000 as bigint) as game_ticks_elapsed,
            cast('2026-09-30 23:30:00+00' as timestamptz) as emitted_at, cast('2026-09-30 23:31:00+00' as timestamptz) as received_at,
            cast('a.jsonl' as varchar) as _raw_file, cast(6 as bigint) as _raw_line
      - input: source('landing', 'guest_arrived')
