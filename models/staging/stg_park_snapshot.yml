version: 2

models:
  - name: stg_park_snapshot
    description: >-
      Answers how the park stands at the start of each game day (cash, guests, rating, admissions and weather), so
      park-level trends start from one clean row per reading. Grain: one row per park snapshot event, which is one per
      session per game day; a reload can give two rows for one park and game day, which later intermediate models
      resolve. Key: event_id, unique after the dedupe that keeps the first-received copy of a repeated delivery.
      Renames and casts only: cash is converted from tenths of a dollar to dollars here, once. Unit: none for the
      model as a whole; clock: game calendar, at the start of the game day.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    config:
      contract:
        enforced: true
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'park_snapshot')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (park_snapshot here); text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_type: bigint
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, one per row after the dedupe; no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_type: bigint
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed, the first key of the dedupe order; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_type: bigint
        data_tests:
          - not_null
      - name: cash_usd
        description: "Park cash in US dollars, converted once from the game's tenths of a dollar, may be negative; unit: US dollar; clock: game calendar, sampled at the start of the game day."
        data_type: decimal(18,2)
        data_tests:
          - not_null
      - name: guests_in_park
        description: "Guests inside the park; unit: count of guests; clock: game calendar, at the start of the game day."
        data_type: integer
        data_tests:
          - not_null
      - name: park_rating
        description: "Park rating in engine units, 0 to 999; unit: rating points; clock: game calendar, at the start of the game day."
        data_type: integer
        data_tests:
          - not_null
      - name: total_admissions
        description: "Cumulative guest admissions, which a reload can rewind; unit: count of guests; clock: game calendar, at the start of the game day."
        data_type: bigint
        data_tests:
          - not_null
      - name: weather
        description: "The park's weather as the game names it (sunny to blizzard); text, no unit; clock: game calendar, at the start of the game day. Null for plugins before 0.3.0."
        data_type: varchar
      - name: temperature_c
        description: "The park's temperature, may be negative; unit: degrees Celsius (unverified against the real game); clock: game calendar, at the start of the game day. Null for plugins before 0.3.0."
        data_type: integer

unit_tests:
  - name: stg_park_snapshot_keeps_the_first_received_copy_of_each_event
    description: >-
      The model keeps the first received copy by received_at, then raw file, then raw line. Nineteen event IDs have two deliveries with the
      same received_at: eighteen tie within one raw file, while one spans a.jsonl and b.jsonl. The lower _raw_line wins whatever the input order (first in
      the input for five, last for thirteen) within a file, and a.jsonl wins the cross-file tie; emitted_at does not override the order. A further event has an
      earlier received_at on a higher line, which still wins. Cash converts from tenths of a dollar to dollars, for positive,
      negative, zero and beyond-floating-point values, and weather and temperature pass through unchanged, nulls included.
    model: stg_park_snapshot
    given:
      - input: source('landing', 'park_snapshot')
        format: sql
        rows: |
          select
            cast(1 as integer) as schema_version, cast('park_snapshot' as varchar) as event_type,
            cast('0.3.0' as varchar) as plugin_version, cast('kpark1' as varchar) as park_id,
            cast('s1' as varchar) as session_id, cast(1 as bigint) as seq, cast('s1-1' as varchar) as event_id,
            cast(1 as integer) as game_year, cast(0 as integer) as game_month, cast(1 as integer) as game_day,
            cast(1000 as bigint) as game_ticks_elapsed, cast('2026-09-30 23:30:00+00' as timestamptz) as emitted_at,
            cast('2026-09-30 23:31:00+00' as timestamptz) as received_at, cast('a.jsonl' as varchar) as _raw_file,
            cast(4 as bigint) as _raw_line, cast(12345 as bigint) as cash_tenths,
            cast(7 as integer) as guests_in_park, cast(650 as integer) as park_rating,
            cast(12 as bigint) as total_admissions, cast('sunny' as varchar) as weather,
            cast(18 as integer) as temperature_c
          union all
          select
            cast(1 as integer), cast('park_snapshot' as varchar), cast('0.3.0' as varchar),
