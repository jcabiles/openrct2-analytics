version: 2

models:
  - name: stg_guest_left
    description: >-
      Answers which known guests are gone, either gone from the game or out of the park after entering it, and why,
      so a guest's visit can be closed with its exit; the exit is found at a daily check. A guest that never
      entered the park can appear here; entered_park says whether it did. Grain: one row per guest_left event, kept once per
      event_id (the earliest delivery by received_at, _raw_file, _raw_line). Key: event_id. The game date is
      the day the plugin noticed the exit, not the exit moment. Renames and casts only; it holds no money
      column. The model has no unit and no clock of its own; each column names its own.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'guest_left')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (guest_left here); text, no unit, no clock."
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_tests:
          - not_null
      - name: guest_key
        description: "Guest identifier the plugin minted, from 1, unique within one session; with session_id it names a guest; a whole number, no unit, no clock."
        data_tests:
          - not_null
      - name: guest_id
        description: "The game's guest entity slot number, a whole number; the game reuses a slot, so it is not an identity (use guest_key); no unit, no clock."
        data_tests:
          - not_null
      - name: exit_reason
        description: "Why the guest is recorded as gone, left or id_reused; text, no unit, no clock."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['left', 'id_reused']
      - name: entered_park
        description: "Whether the guest was seen in the park at the start or at any later check; true or false, no unit, no clock."
        data_tests:
          - not_null
      - name: arrived_in_session
        description: "False for a guest seeded at session start, true for one seen arriving; true or false, no unit, no clock."
        data_tests:
          - not_null
      - name: in_cohort
        description: "Whether the guest was a snapshot cohort member when it left; true or false, no unit, no clock."
        data_tests:
          - not_null

