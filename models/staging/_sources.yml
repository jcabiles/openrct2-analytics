            data_tests:
              - not_null
          - name: received_at
            description: "Listener wall-clock time when the line landed, UTC."
            data_tests:
              - not_null
          - name: save_id
            description: "Save identifier the plugin minted in the save hook and stored in the saved file; text, no unit. Minted once per save, so it is the grain on its own."
