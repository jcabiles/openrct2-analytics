  - name: registry
    description: "CSV deliveries from the park registry feed and the play-mode label feed (append-only except a pre-go-live delete, ADR 0033), one file per delivery under v1/ of the registry_root variable. Every column is read as text and the file path is kept as filename, so staging owns the casts. The dev and ci targets default to the committed sample feed; rehearsal and company have no default and fail the build unless a feed folder is passed."
    config:
      registry_root: "{{ var('registry_root', 'data/sample/rehearsal/registry' if target.name in ['dev', 'ci'] else 'invalid-registry-root') }}"
    tables:
      - name: park_registry
        description: "One row per park per delivery file; a later delivery restates the park, it does not replace the earlier row."
        config:
          external_location: "read_csv('{registry_root}/{file_glob}', header=true, filename=true, all_varchar=true, union_by_name=true)"
          file_glob: "v1/park_registry_*.csv"
        columns:
          - name: park_id
            description: "The park's identifier, the same text the plugin sends as park_id; no unit."
          - name: company_start_year
            description: "The company calendar year in which the park's first game year falls; a whole calendar year, no unit."
          - name: game_year_origin
            description: "The game year that counts as the park's first company year; the game's game_year starts at 1, so the value is at least 1. A whole number of game years, no unit."
          - name: data_set
            description: "The data set the row belongs to, rehearsal or company; text."
          - name: note
            description: "Free text from the delivery; may be empty."
          - name: delivered_on
            description: "The calendar date the delivery was made; a date, no time."
      - name: session_play_mode
        description: "One row per labeled session per delivery file; a session with no row is managed. A folder may hold no label file yet; stg_session_play_mode guards that case."
        config:
          external_location: "read_csv('{registry_root}/{file_glob}', header=true, filename=true, all_varchar=true, union_by_name=true)"
          file_glob: "v1/session_play_mode_*.csv"
        columns:
          - name: session_id
            description: "The session's identifier, the same text the plugin sends as session_id; no unit."
          - name: park_id
            description: "The park's identifier, the same text the plugin sends as park_id; no unit."
          - name: play_mode
            description: "Who played the session, managed or autopilot; text."
          - name: ready_confirmation
            description: "Empty, or exactly the park's ready phrase; required on a park's first autopilot row. Text."
          - name: data_set
            description: "The data set the row belongs to, rehearsal or company; text."
          - name: delivered_on
            description: "The calendar date the delivery was made, equal to the date in the file name; a date, no time."
