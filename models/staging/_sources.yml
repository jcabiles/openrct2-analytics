            description: "The save_id stored in the park this session loaded, read at plugin start; text, no unit. It matches that save's save_written event. Null when the park was never saved by plugin 0.3.0 or later, or the stored value is not a non-empty string; absent in events from plugins before 0.3.0."
          - name: loaded_save_session_id
