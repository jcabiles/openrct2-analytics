          - name: running_cost_per_fortnight_tenths
            description: "Running cost in tenths of a dollar (game money unit); the game's type definitions say it is billed every fortnight, which is unverified. May be null: a value outside the safe JSON integer range is sent as null."
          - name: total_profit_tenths
            description: "Lifetime profit in tenths of a dollar (game money unit) when read; may be negative. A value outside plus or minus (2^53 - 1), such as a never-opened stall's, is sent as null."
          - name: income_per_game_hour_tenths
            description: "Income in tenths of a dollar (game money unit) per game hour, the Finance tab's per-hour figure; the game's own hour, not a wall-clock hour. A value outside plus or minus (2^53 - 1) is sent as null."
          - name: profit_per_game_hour_tenths
            description: "Profit in tenths of a dollar (game money unit) per game hour, the Finance tab's per-hour figure; the game's own hour, not a wall-clock hour; may be negative. A value outside plus or minus (2^53 - 1), such as a never- opened stall's, is sent as null."
          - name: value_tenths
            description: "The ride's value as the game reports it; the tenths-of-a-dollar unit is unverified (the engine compares it with prices)."
          - name: reliability_pct
            description: "Reliability as read, a percent; read when the snapshot step ran."
          - name: downtime_pct
            description: "Downtime as read, a percent; read when the snapshot step ran."
          - name: satisfaction_pct
            description: "Guest satisfaction as read, a percent; 1,275 means not yet measured, sent as read."
          - name: guests_on_ride
            description: "Guests on the ride when read, a count."
          - name: station_count
            description: "Station slots in use when read, a count: the game always returns 255 slots and a slot is in use when its start is set."
          - name: queue_time_max_minutes
            description: "The largest queue time among the used stations, in minutes; null when no station is used."
          - name: max_speed_mph
            description: "Highest speed of the ride's test or running laps, in miles per hour as the game reports it to plugins (not yet checked against the game's ride window); expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: average_speed_mph
            description: "Average speed of the ride, in miles per hour as the game reports it to plugins (not yet checked against the game's ride window); expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: ride_time_seconds
            description: "Time one lap takes, in seconds of ride time; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: ride_length_meters
            description: "Length of the ride's track, in metres; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: max_positive_vertical_g
            description: "Highest positive vertical force, in g (multiples of gravity), scale as reported and unverified; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: max_negative_vertical_g
            description: "Highest negative vertical force, in g (multiples of gravity), scale as reported and unverified; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: max_lateral_g
            description: "Highest sideways force, in g (multiples of gravity), scale as reported and unverified; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: total_air_time_seconds
            description: "Total time riders spend in the air, in seconds of air time; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: drop_count
            description: "Number of drops on the track, a count; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: lift_hill_count
            description: "Number of lift hills on the track, a count; expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: highest_drop_height_units
            description: "Height of the highest drop, in the game's height units (not metres or feet); expected to be zero until the ride's first test run; game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: inversion_count
            description: "Number of inversions counted by walking the built track (not from a test run), a count; so a finished but untested coaster can carry a non-zero count while the read statistics are zero. Null in these cases, told apart by ride_category: ride_category null (the ride's type is in neither research list, so it was not looked at); ride_category other than rollercoaster (not counted by design); ride_category rollercoaster (the walk failed: the 5,000-step cap was reached, no station was in use, no track element was found at the station, or the game returned a null iterator or segment). Game clock: the tick the snapshot step ran; absent in events from plugins before 0.5.0."
          - name: ride_category
            description: "The game's research category of the ride's type (for example rollercoaster), read once per session from the invented and uninvented research lists; text, no unit; null when the type is in neither list. Game clock: the tick the snapshot step ran. The category table itself is read once per session, at the session's first ride_list step, and each snapshot looks the ride's type up in it; absent in events from plugins before 0.5.0."
      - name: save_written
        description: One row per landed save_written delivery; a repeat delivery of one event_id is a second row.
        config:
