# Generated by `uv run python scripts/generate_dbt_sources.py` from the data contracts. Do not edit by hand.
version: 2

sources:
  - name: landing
    description: "Parquet files the converter writes from the raw captures, one file per event type under v1/. The root folder is the parquet_root variable, so one setting switches between the committed sample data and a real capture. The dev and ci targets default to the committed sample; rehearsal and company have no default and fail the build unless a Parquet folder is passed."
    tables:
      - name: finance_month
        description: One row per landed finance_month delivery; a repeat delivery of one event_id is a second row.
        config:
          external_location: "{{ var('parquet_root', 'data/sample/rehearsal' if target.name in ['dev', 'ci'] else 'invalid-parquet-root') }}/v1/finance_month.parquet"
        columns:
          - name: schema_version
            description: "Major version of the contract set, a count (always 1 here); the landing folder is v<schema_version>."
            data_tests:
              - not_null
          - name: event_type
            description: "Event kind, one of session_start, plugin_stats, park_snapshot, finance_month, ride_snapshot, save_written, guest_arrived, guest_left, guest_refused, guest_snapshot, guest_boarded, weather_change or game_action; text, no unit."
            data_tests:
              - not_null
          - name: plugin_version
            description: "Plugin build that sent the event; text version, no unit."
            data_tests:
              - not_null
          - name: park_id
            description: "Stable park identifier from park storage; text, no unit."
            data_tests:
              - not_null
          - name: session_id
            description: "Plugin start identifier, new on every start; text, no unit."
            data_tests:
              - not_null
          - name: _raw_file
            description: "Base name of the raw JSON Lines file the row was converted from, never a path; text, no unit. Added by the converter; the plugin never sends it."
            data_tests:
              - not_null
          - name: _raw_line
            description: "1-based physical line number of the row in that raw file, blank lines counted; a count, no unit or clock. Added by the converter; the plugin never sends it."
            data_tests:
              - not_null
          - name: seq
            description: "Order within the session across all event types, a count from 1 stamped at hand-off to the socket; no gaps or repeats (the converter audits gaps)."
            data_tests:
              - not_null
          - name: event_id
            description: "session_id-seq; text. Identifies one game event; the same event_id can appear on more than one landed delivery, and event-type staging models keep the first-received row of each."
            data_tests:
              - not_null
          - name: game_year
            description: "In-game year, from 1; game calendar clock."
            data_tests:
              - not_null
          - name: game_month
            description: "In-game month, 0 to 7 (March = 0); game calendar clock."
            data_tests:
              - not_null
          - name: game_day
            description: "In-game day of the month, from 1; game calendar clock."
            data_tests:
              - not_null
          - name: game_ticks_elapsed
            description: "Game ticks since the park began, a count; game clock."
            data_tests:
              - not_null
          - name: emitted_at
            description: "Producer wall-clock time, UTC."
            data_tests:
              - not_null
          - name: received_at
            description: "Listener wall-clock time when the line landed, UTC."
            data_tests:
              - not_null
          - name: statement_year
            description: "In-game year of the closed month, from 1; game calendar clock. Part of the grain."
          - name: statement_month
            description: "In-game month that closed, 0 to 7 (March = 0); game calendar clock. Part of the grain."
          - name: ride_construction_tenths
            description: "The closed month's ride construction total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: ride_runningcosts_tenths
            description: "The closed month's ride running costs total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: land_purchase_tenths
            description: "The closed month's land purchase total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: landscaping_tenths
            description: "The closed month's landscaping total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: park_entrance_tickets_tenths
            description: "The closed month's park entrance tickets total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: park_ride_tickets_tenths
            description: "The closed month's ride tickets total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: shop_sales_tenths
            description: "The closed month's shop sales total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: shop_stock_tenths
            description: "The closed month's shop stock total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: food_drink_sales_tenths
            description: "The closed month's food and drink sales total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: food_drink_stock_tenths
            description: "The closed month's food and drink stock total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: wages_tenths
            description: "The closed month's staff wages total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: marketing_tenths
            description: "The closed month's marketing total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: research_tenths
            description: "The closed month's research total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: interest_tenths
            description: "The closed month's loan interest total, in tenths of a dollar (game money unit); game calendar month. Income is positive and spending negative."
          - name: cash_tenths
            description: "Park cash in tenths of a dollar (game money unit), may be negative; read in the day-1 callback of the month after the statement month, which runs at the end of that month's first tick, so it can include new_month_booked_tenths."
          - name: bank_loan_tenths
            description: "Bank loan outstanding in tenths of a dollar (game money unit), never negative; read at the same moment as cash_tenths."
          - name: new_month_booked_tenths
            description: "The money already booked to the new month when the statement was read, the sum of index 0 of the 14 expenditure histories, in tenths of a dollar (game money unit); game calendar; signed like the ledger lines. Absent from statements sent by plugin 0.5.0 and earlier."
