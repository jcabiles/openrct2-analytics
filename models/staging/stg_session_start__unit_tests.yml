version: 2

unit_tests:
  - name: stg_session_start_keeps_first_delivery_by_received_file_line
    description: >-
      It proves the earliest received_at wins even from a higher line and an earlier emitted_at, that _raw_file
      breaks a received_at tie before _raw_line, and that the lower _raw_line wins at equal received_at and
      _raw_file, whatever the input order.
    model: stg_session_start
    given:
      - input: source('landing', 'session_start')
        format: sql
        rows: |
          select
            cast(1 as integer) as schema_version,
            cast('session_start' as varchar) as event_type,
            cast('0.3.0' as varchar) as plugin_version,
            cast('kpark1' as varchar) as park_id,
            cast('s1' as varchar) as session_id,
            cast(1 as bigint) as seq,
            cast('s1-1' as varchar) as event_id,
            cast(2 as integer) as game_year,
            cast(3 as integer) as game_month,
            cast(4 as integer) as game_day,
            cast(1000 as bigint) as game_ticks_elapsed,
            cast('2026-09-30 23:10:00+00' as timestamptz) as emitted_at,
            cast('2026-09-30 23:31:00+00' as timestamptz) as received_at,
            cast('a.jsonl' as varchar) as _raw_file,
            cast(2 as bigint) as _raw_line,
            cast(122 as integer) as api_version,
            cast('Loser 1' as varchar) as park_name,
            cast('Scenario' as varchar) as scenario_name,
            cast(true as boolean) as headless,
            cast(1 as integer) as game_speed,
            cast('warm' as varchar) as climate,
            cast(null as varchar) as loaded_save_id,
            cast(null as varchar) as loaded_save_session_id,
            cast(null as bigint) as loaded_save_seq_floor,
            cast(null as integer) as loaded_save_lines_waiting
