version: 2

models:
  - name: stg_guest_boarded
    description: >-
      Answers which guest sat down on which ride at a seat poll, so ride boardings can be counted and priced.
      Grain: one row per guest_boarded event, which is one guest newly seated on one ride at one seat poll, kept
      once per event_id (the earliest delivery by received_at, _raw_file, _raw_line). Key: event_id. Renames and
      casts only, except that the two money columns are converted from tenths of a dollar to dollars here, once;
      happiness 255 is the maximum and passes through. Capture limits: a boarding under 20 ticks long between
      two polls is missed, guests already seated when a session starts are not recorded, and no amount paid is
      recorded. The model has no unit and no clock of its own; each column names its own.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    config:
      contract:
        enforced: true
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'guest_boarded')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (guest_boarded here); text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_type: bigint
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_type: bigint
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_type: bigint
        data_tests:
          - not_null
      - name: guest_id
        description: "The game's guest entity slot number, a whole number; the game reuses a slot, so it is not an identity (use guest_key); no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: guest_key
        description: "The guest's key in the known-guest table at the poll; null when the guest's slot is not in the table; no unit, no clock."
        data_type: integer
      - name: ride_id
        description: "The ride the guest boarded, a ride slot number that the game reuses after a ride is demolished; no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: detected_at_ticks
        description: "Game tick of the seat poll that found the guest seated; the boarding happened in the 20 ticks before it; unit: game tick; clock: game."
        data_type: bigint
        data_tests:
          - not_null
      - name: ride_price_listed_usd
        description: "The ride's listed admission price at the poll, the listed price and not the amount charged, because a voucher or a price change between the charge and the poll makes them differ; unit: US dollars; clock: game, at the poll. Null when the ride is gone or has no price."
        data_type: decimal(18,2)
      - name: happiness
        description: "Guest happiness at the poll, 0 to 255; 255 is the maximum and is kept, not nulled; unit: game scale 0 to 255; clock: game, at the poll."
        data_type: integer
      - name: min_intensity
        description: "The guest's preferred minimum ride intensity at the poll; unit: game scale 0 to 15; clock: game, at the poll."
        data_type: integer
      - name: max_intensity
        description: "The guest's preferred maximum ride intensity at the poll; unit: game scale 0 to 15; clock: game, at the poll."
        data_type: integer
      - name: nausea_tolerance
        description: "The guest's nausea tolerance at the poll; unit: game scale 0 to 3; clock: game, at the poll."
        data_type: integer
      - name: guest_cash_usd
        description: "The guest's cash at the poll, after paying; unit: US dollars; clock: game, at the poll."
        data_type: decimal(18,2)

