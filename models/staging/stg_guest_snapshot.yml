version: 2

models:
  - name: stg_guest_snapshot
    description: >-
      Answers how the guests in a random daily cohort feel and what they carry, so guest mood and spending
      questions start from one clean row per reading. Grain: one row per cohort member per game day, which is
      one guest_snapshot event, kept once per event_id (the earliest delivery by received_at, _raw_file,
      _raw_line). Key: event_id. The cohort is a random sample, not every guest: each new guest joins with a fixed probability only while
      the cohort has room, so once it is full later guests cannot join and it leans to earlier guests. Its use is
      observational. Renames and casts only, plus the one money conversion from tenths of a
      dollar to dollars and one placeholder turned to null: 65535 on thought_item (the thought has no argument).
      The values 255 (maximum on happiness, hunger, thirst and nausea) and the empty items_carried pass through
      unchanged.
      The model has no unit and no clock of its own; each column names its own.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    config:
      contract:
        enforced: true
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'guest_snapshot')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (guest_snapshot here); text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_type: bigint
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, unique after the dedupe; no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began; unit: game tick; clock: game."
        data_type: bigint
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_type: bigint
        data_tests:
          - not_null
      - name: guest_key
        description: "Guest identifier the plugin minted, from 1, unique within one session; with session_id it names a guest; a whole number, no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: guest_id
        description: "The game's guest entity slot number, a whole number; the game reuses a slot, so it is not an identity (use guest_key); no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: happiness
        description: "Guest happiness as read, 0 (unhappy) to 255 (happy); unit: game scale 0 to 255 (255 is the maximum and is kept as sent); clock: game, at the daily guest step."
        data_type: integer
      - name: hunger
        description: "Guest hunger as read; unit: game scale 0 to 255 (255 is the maximum and is kept as sent); clock: game, at the daily guest step."
        data_type: integer
      - name: thirst
        description: "Guest thirst as read; unit: game scale 0 to 255 (255 is the maximum and is kept as sent); clock: game, at the daily guest step."
        data_type: integer
      - name: nausea
        description: "Guest nausea as read; unit: game scale 0 to 255 (255 is the maximum and is kept as sent); clock: game, at the daily guest step."
        data_type: integer
      - name: energy
        description: "Guest energy as read; unit: game scale 32 to 128; clock: game, at the daily guest step."
        data_type: integer
      - name: guest_cash_usd
        description: "The guest's cash at the read in US dollars (decimal(18,2)), converted once from the source's tenths of a dollar; unit: US dollars; clock: game, at the daily guest step. Null when the source sent none."
        data_type: decimal(18,2)
      - name: items_carried
        description: "Names of the items the guest carries (the game's item names) joined with |; the empty string for none, kept as sent; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: thought_type
        description: "Type of the guest's newest thought; text, no unit, no clock; null when the guest has no thought."
        data_type: varchar
      - name: thought_item
        description: "The newest thought's item as read; meaning depends on thought_type (a ride slot number for a refusal); null when the thought has no argument (the game sends 65535, turned to null here), when the guest has no thought, or when the game's read of the item failed; no unit, no clock."
        data_type: integer

unit_tests:
  - name: stg_guest_snapshot_keeps_first_delivery_by_received_file_line
