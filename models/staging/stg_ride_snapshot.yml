version: 2

models:
  - name: stg_ride_snapshot
    description: >-
      Answers which rides, stalls and facilities the park has, and how each is rated, priced and earning when it
      is read, so ride-level questions start from one clean row per reading. Grain: one row per ride_snapshot
      event, which is one per ride, stall or facility per snapshot step; a ride is read once per game day; the
      unit and clock of each column are in its description. Key: event_id, unique after the dedupe that keeps
      the first-received copy of a repeated delivery (the contract's natural key is session_id, ride_id and
      game_ticks_elapsed). Renames, casts and placeholders to null only: money is converted from tenths of a
      dollar to dollars here, once, except value_tenths, which passes through raw because its unit is
      unverified. Unit: none for the model as a whole; clock: game, at the snapshot step.
    meta:
      contract_version: 1.8.0
      expected_min_rows: 1
    config:
      contract:
        enforced: true
    data_tests:
      - repeat_delivery_payload_differs:
          arguments:
            source_relation: source('landing', 'ride_snapshot')
    columns:
      - name: schema_version
        description: "Major version of the contract set; unit: count (always 1 here); no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        description: "Event kind (ride_snapshot here); text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: plugin_version
        description: "Plugin build that sent the event; text version, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: park_id
        description: "Stable park identifier from park storage; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: session_id
        description: "Plugin start identifier, new on every start; text, no unit, no clock. Part of the contract's natural key."
        data_type: varchar
        data_tests:
          - not_null
      - name: seq
        description: "Order within the session across all event types, from 1; unit: count; no clock (session order, not a time)."
        data_type: bigint
        data_tests:
          - not_null
      - name: event_id
        description: "session_id-seq; text, one per row after the dedupe; no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: game_year
        description: "In-game year, from 1; unit: year; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_month
        description: "In-game month, 0 to 7 (March = 0); unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_day
        description: "In-game day of the month, from 1; unit: day; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: game_ticks_elapsed
        description: "Game ticks since the park began, the tick at which the snapshot step ran; unit: game tick; clock: game. Part of the contract's natural key."
        data_type: bigint
        data_tests:
          - not_null
      - name: emitted_at
        description: "Producer time when the event was sent; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: received_at
        description: "Listener time when the line landed, the first key of the dedupe order; unit: timestamp (UTC); clock: wall clock."
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: _raw_file
        description: "Base name of the raw JSON Lines file the delivery came from, never a path; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: _raw_line
        description: "1-based physical line number of the delivery in that raw file, blank lines counted; unit: line number; no clock."
        data_type: bigint
        data_tests:
          - not_null
      - name: ride_id
        description: "The game's ride slot number, a whole number; the game reuses a slot after demolition, so it is not an identity by itself; no unit, no clock. Part of the contract's natural key."
        data_type: integer
        data_tests:
          - not_null
      - name: ride_name
        description: "The ride's name when read; text, no unit, no clock (the player can rename a ride)."
        data_type: varchar
        data_tests:
          - not_null
      - name: ride_type
        description: "The game's built-in ride type number; no unit, no clock."
        data_type: integer
        data_tests:
          - not_null
      - name: ride_object
        description: "The ride's object identifier, for example rct2.ride.burgb; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: classification
        description: "What kind of ride it is: ride, stall or facility; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: status
        description: "Operating state when read: closed, open, testing or simulating; text, no unit, no clock."
        data_type: varchar
        data_tests:
          - not_null
      - name: excitement_hundredths
        description: "Excitement rating when the snapshot step ran; unit: hundredths of a rating point (652 means 6.52); clock: game, at the snapshot step. Null for an unrated ride (the game sends -1)."
        data_type: integer
      - name: intensity_hundredths
        description: "Intensity rating when the snapshot step ran; unit: hundredths of a rating point (652 means 6.52); clock: game, at the snapshot step. Null for an unrated ride (the game sends -1)."
        data_type: integer
      - name: nausea_hundredths
        description: "Nausea rating when the snapshot step ran; unit: hundredths of a rating point (652 means 6.52); clock: game, at the snapshot step. Null for an unrated ride (the game sends -1)."
        data_type: integer
      - name: price_1_usd
        description: "First price in US dollars (decimal(18,2)): a ride's admission price or a stall's first item price; unit: US dollars; clock: game, at the snapshot step. Null when the price list is shorter (an ATM's is empty)."
        data_type: decimal(18,2)
      - name: price_2_usd
        description: "Second price in US dollars (decimal(18,2)): a ride's photo price or a stall's second item price; unit: US dollars; clock: game, at the snapshot step. Null when the price list is shorter."
        data_type: decimal(18,2)
      - name: shop_item
        description: "The game's code for the first item a stall sells; no unit, no clock. Null when the stall sells no item (the game sends 255)."
        data_type: integer
      - name: shop_item_secondary
        description: "The game's code for the second item a stall sells; no unit, no clock. Null when there is no second item (the game sends 255)."
        data_type: integer
      - name: total_customers
        description: "Guests who have used the ride, a lifetime count when read (a reload can rewind it); unit: guests; clock: game, at the snapshot step."
        data_type: bigint
        data_tests:
          - not_null
      - name: build_date_months_elapsed
        description: "The month the ride was built, as months elapsed since the park began; unit: month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: age_months
        description: "The ride's age when read; unit: game month; clock: game calendar."
        data_type: integer
        data_tests:
          - not_null
      - name: running_cost_per_fortnight_usd
        description: "Running cost in US dollars (decimal(18,2)); the game's type definitions say it is billed every fortnight, which is unverified; unit: US dollars; clock: game, at the snapshot step. Null when the game sent a value outside the safe JSON integer range."
        data_type: decimal(18,2)
      - name: total_profit_usd
        description: "Lifetime profit in US dollars (decimal(18,2)) when read, may be negative; unit: US dollars; clock: game, at the snapshot step. Null when the game sent a value outside the safe JSON integer range, such as a never-opened stall's."
        data_type: decimal(18,2)
      - name: income_per_game_hour_usd
        description: "Income in US dollars (decimal(18,2)) per game hour, the Finance tab's per-hour figure; unit: US dollars per game hour; clock: game hour, not a wall-clock hour. Null when the game sent a value outside the safe JSON integer range."
        data_type: decimal(18,2)
      - name: profit_per_game_hour_usd
        description: "Profit in US dollars (decimal(18,2)) per game hour, the Finance tab's per-hour figure, may be negative; unit: US dollars per game hour; clock: game hour, not a wall-clock hour. Null when the game sent a value outside the safe JSON integer range."
        data_type: decimal(18,2)
      - name: value_tenths
        description: "The ride's value as the game reports it, passed through raw and not converted to dollars; unit: unverified (tenths of a dollar is the assumed unit, the engine compares it with prices); clock: game, at the snapshot step."
        data_type: bigint
      - name: reliability_pct
        description: "Reliability as read; unit: percent; clock: game, at the snapshot step."
        data_type: integer
      - name: downtime_pct
        description: "Downtime as read; unit: percent; clock: game, at the snapshot step."
        data_type: integer
      - name: satisfaction_pct
        description: "Guest satisfaction as read; unit: percent; clock: game, at the snapshot step. Null when not yet measured (the game sends 1,275)."
        data_type: integer
      - name: guests_on_ride
        description: "Guests on the ride when read; unit: guests; clock: game, at the snapshot step."
        data_type: integer
      - name: station_count
        description: "Station slots in use when read, a slot is in use when its start is set; unit: stations; clock: game, at the snapshot step."
        data_type: integer
        data_tests:
          - not_null
      - name: queue_time_max_minutes
        description: "The largest queue time among the used stations; unit: minutes; clock: game, at the snapshot step. Null when no station is used."
        data_type: integer

