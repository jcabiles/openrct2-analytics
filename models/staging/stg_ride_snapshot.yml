      excitement, intensity and nausea ratings, 1,275 in satisfaction and 255 in shop_item and
      shop_item_secondary. Each row puts one placeholder next to an ordinary value in the neighbouring
      column of the same kind (254, 0 and 1,274 stay), and each placeholder sits in a different column
      per row, so nulling the wrong column, or skipping one, fails. Values that look like a placeholder
